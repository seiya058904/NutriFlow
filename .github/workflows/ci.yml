name: CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/readme-*'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/readme-*'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regression tests
        run: node test-reliability.js

      - name: Two-entry parity check
        run: node test-parity.js

      - name: Inline JS syntax check
        run: node check-html-syntax.js

      - name: Repository structure check
        run: node check-repo-structure.js

  browser-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - name: Exercise both entries and same-origin pages
        run: python tests/browser-regressions.py
      - name: Preserve browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: nutriflow-browser
          path: /tmp/nutriflow-browser
          retention-days: 7
