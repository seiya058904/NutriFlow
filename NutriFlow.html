<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a84ff">
  <title>每日饮食记录</title>
  <style>
    /* ============================================================
       1. Design tokens（亮色为默认主题）
       ============================================================ */
    :root {
      color-scheme: light;

      /* 表面层级 */
      --surface-page: #f4f5f9;
      --surface-primary: rgba(255, 255, 255, 0.84);
      --surface-secondary: #eef0f6;
      --surface-elevated: rgba(255, 255, 255, 0.97);
      --surface-hover: rgba(15, 23, 42, 0.055);

      /* 边框与文字 */
      --border-subtle: rgba(88, 96, 115, 0.16);
      --border-strong: rgba(88, 96, 115, 0.32);
      --text-primary: #1d1d1f;
      --text-secondary: #565e6c;
      --text-tertiary: #8a94a6;

      /* 强调色与语义状态 */
      --accent: #0a84ff;
      --accent-deep: #0064d2;
      --accent-soft: rgba(10, 132, 255, 0.12);
      --success: #1f8a3b;
      --warning: #c76e00;
      --danger: #d70015;

      /* 输入与图表 */
      --chart-bg: #fbfbfd;
      --input-bg: rgba(255, 255, 255, 0.9);
      --input-focus-bg: #ffffff;
      --progress-track-bg: rgba(88, 96, 115, 0.14);
      --marker-ring: rgba(255, 255, 255, 0.9);

      /* 状态色（用于填充/标记，两个主题共用） */
      --fill-good: #34c759;
      --fill-warn: #ff9500;
      --fill-low: #ff453a;
      --fill-none: #c7c7cc;

      /* 兼容别名：内联 SVG 与既有规则仍引用这些名字 */
      --bg: var(--surface-page);
      --panel: var(--surface-primary);
      --text: var(--text-primary);
      --muted: var(--text-secondary);
      --soft: var(--text-tertiary);
      --line: var(--border-subtle);
      --blue: var(--accent);
      --blue-deep: var(--accent-deep);
      --green: var(--fill-good);
      --orange: var(--fill-warn);
      --red: var(--fill-low);
      --violet: #5e5ce6;
      --btn-secondary-bg: var(--surface-secondary);
      --toast-bg: var(--surface-elevated);

      /* 阴影、圆角、动效 */
      --shadow-soft: 0 8px 24px rgba(30, 41, 59, 0.07);
      --radius: 20px;
      --radius-sm: 14px;
      --ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast: 130ms;
      --dur-normal: 200ms;
      --dur-slow: 320ms;
      --section-gap: 20px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --surface-page: #17171a;
      --surface-primary: rgba(40, 40, 43, 0.86);
      --surface-secondary: rgba(255, 255, 255, 0.065);
      --surface-elevated: rgba(40, 40, 43, 0.98);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.24);
      --text-primary: #f5f5f7;
      --text-secondary: #a4a9b0;
      --text-tertiary: #6f747d;
      --accent: #0a84ff;
      --accent-deep: #409cff;
      --accent-soft: rgba(10, 132, 255, 0.2);
      --success: #32d74b;
      --warning: #ffb340;
      --danger: #ff6b61;
      --chart-bg: #232327;
      --input-bg: rgba(58, 58, 60, 0.9);
      --input-focus-bg: #3a3a3c;
      --progress-track-bg: rgba(255, 255, 255, 0.14);
      --marker-ring: rgba(23, 23, 26, 0.9);
      --fill-none: #636366;
      --shadow-soft: 0 12px 28px rgba(0, 0, 0, 0.34);
    }

    /* ============================================================
       2. Reset / Base
       ============================================================ */
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background-color var(--dur-normal) ease, color var(--dur-normal) ease;
    }

    button,
    input,
    textarea {
      font: inherit;
      min-width: 0;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ============================================================
       3. Layout primitives：顶部 header + 桌面双栏网格 + 区块编排
       ============================================================ */
    .app {
      display: grid;
      grid-template-columns: minmax(340px, 380px) minmax(0, 1fr);
      grid-template-areas:
        "warn warn"
        "header header"
        "entry overview"
        "calendar stats"
        "records records"
        "data data";
      gap: var(--section-gap);
      align-items: stretch;
      width: min(100% - 48px, 1400px);
      margin: 0 auto;
      padding: 26px 0 120px;
    }

    .storage-warning {
      grid-area: warn;
      margin: 0;
      padding: 12px 16px;
      border: 1px solid var(--fill-low);
      border-radius: var(--radius-sm);
      color: var(--danger);
      background: var(--surface-primary);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
    }

    .panel {
      background: var(--surface-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      min-width: 0;
    }

    .panel-inner {
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 760;
      letter-spacing: -0.2px;
    }

    .entry-panel {
      grid-area: entry;
    }

    .overview-panel {
      grid-area: overview;
    }

    .stats-panel {
      grid-area: stats;
    }

    .calendar-panel {
      grid-area: calendar;
    }

    .records-section {
      grid-area: records;
    }

    .empty-state {
      padding: 24px 18px;
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.6;
    }

    .section-title {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .water-block {
      min-width: 0;
    }

    .quick-fill {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chip-step {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--dur-fast) ease, transform var(--dur-fast) ease;
    }

    .chip-step:active {
      transform: scale(0.97);
    }

    /* ============================================================
       4. Components
       ============================================================ */

    /* ---- 4.1 应用头部 ---- */
    .app-header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      background: var(--surface-primary);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      min-width: 0;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .brand-cn {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0 0;
      color: var(--text-tertiary);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .privacy-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-secondary);
      font-weight: 700;
      white-space: nowrap;
    }

    .privacy-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--fill-good);
    }

    .header-side {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .today-pill {
      padding: 8px 13px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .theme-btn {
      font-size: 17px;
    }

    /* ---- 4.2 表单与按钮 ---- */
    .form {
      display: grid;
      gap: 12px;
    }

    .form label,
    .target-fields label {
      display: grid;
      gap: 7px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.25;
      font-weight: 720;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease, background var(--dur-fast) ease;
    }

    input {
      height: 46px;
      padding: 0 14px;
    }

    textarea {
      min-height: 136px;
      resize: vertical;
      padding: 14px;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      background: var(--input-focus-bg);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 46px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 0 18px;
      cursor: pointer;
      font-weight: 720;
      font-size: 14px;
      color: #fff;
      background: var(--accent);
      transition: transform var(--dur-fast) var(--ease-out-soft), box-shadow var(--dur-fast) ease, filter var(--dur-fast) ease;
    }

    .btn:active {
      transform: translateY(0) scale(0.99);
      filter: brightness(0.93);
    }

    .btn.secondary {
      color: var(--text-primary);
      background: var(--surface-secondary);
      box-shadow: inset 0 0 0 1px var(--border-subtle);
    }

    .btn.quiet {
      min-height: 40px;
      padding: 0 14px;
      color: var(--text-secondary);
      font-size: 13px;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--border-subtle);
    }

    .message {
      min-height: 20px;
      margin: 2px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      color: var(--danger);
    }

    .message.success {
      color: var(--success);
    }

    /* ---- 4.3 每日目标（折叠设置区） ---- */
    .target-settings {
      margin-top: 18px;
    }

    .target-settings > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 2px;
      border-top: 1px solid var(--border-subtle);
      cursor: pointer;
      list-style: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 760;
    }

    .target-settings > summary::-webkit-details-marker {
      display: none;
    }

    .target-settings > summary::after {
      content: "›";
      margin-left: auto;
      color: var(--text-tertiary);
      font-size: 16px;
      transition: transform var(--dur-fast) var(--ease-out-soft);
    }

    .target-settings[open] > summary::after {
      transform: rotate(90deg);
    }

    .target-fields {
      display: grid;
      gap: 12px;
      padding-top: 4px;
    }

    .target-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 700;
    }

    .target-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-secondary);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.good {
      background: var(--fill-good);
    }

    .legend-dot.warn {
      background: var(--fill-warn);
    }

    .legend-dot.low {
      background: var(--fill-low);
    }

    .legend-dot.none {
      background: var(--fill-none);
    }

    .target-progress {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .target-progress-card {
      padding: 12px 13px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-secondary);
    }

    .target-progress-card span {
      display: block;
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 700;
    }

    .target-progress-card strong {
      display: block;
      margin-top: 6px;
      font-size: 20px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .target-progress-track {
      height: 8px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--progress-track-bg);
    }

    .target-progress-fill {
      height: 100%;
      border-radius: inherit;
      transition: width var(--dur-normal) var(--ease-out-soft);
    }

    .target-status-good,
    .target-progress-fill.target-status-good {
      background: var(--fill-good);
    }

    .target-status-warn,
    .target-progress-fill.target-status-warn {
      background: var(--fill-warn);
    }

    .target-status-low,
    .target-progress-fill.target-status-low {
      background: var(--fill-low);
    }

    .target-status-none,
    .target-progress-fill.target-status-none {
      background: var(--fill-none);
    }

    /* ---- 4.4 今日 KPI ---- */
    .today-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 12px;
    }

    .summary-card {
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      background: var(--surface-secondary);
      min-width: 0;
    }

    .summary-label {
      display: block;
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 760;
    }

    .summary-value {
      display: block;
      margin-top: 5px;
      font-size: 23px;
      line-height: 1.1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .summary-note {
      display: block;
      margin-top: 5px;
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    /* ---- 4.5 趋势图工作区 ---- */
    .chart-card {
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
    }

    .chart-card .empty-state {
      margin: 14px 16px 16px;
    }

    .chart-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 0;
    }

    .chart-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      margin-right: auto;
      font-size: 14px;
      font-weight: 760;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .chart-note {
      color: var(--text-tertiary);
      font-size: 12px;
      white-space: nowrap;
    }

    .chart-range-btns {
      display: flex;
      gap: 4px;
    }

    .range-btn {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 13px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    }

    .range-btn:active {
      transform: scale(0.96);
    }

    .range-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .trend-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 16px 0;
    }

    .trend-chip {
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-secondary);
    }

    .trend-chip span {
      display: block;
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 700;
    }

    .trend-chip strong {
      display: block;
      margin-top: 5px;
      font-size: 17px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      padding: 10px 16px 0;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-line {
      width: 22px;
      height: 3px;
      border-radius: 999px;
      display: inline-block;
      background: var(--accent);
    }

    .chart-frame {
      padding: 8px 14px 14px;
    }

    .chart-frame svg {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    .hover-point {
      outline: none;
    }

    .chart-hover-region {
      fill: transparent;
      cursor: crosshair;
    }

    .chart-focus-line,
    .chart-focus-dot,
    .point-tooltip {
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-fast) ease;
    }

    .hover-point:hover .chart-focus-line,
    .hover-point:hover .chart-focus-dot,
    .hover-point:hover .point-tooltip,
    .hover-point:focus .chart-focus-line,
    .hover-point:focus .chart-focus-dot,
    .hover-point:focus .point-tooltip {
      opacity: 1;
    }

    .point-tooltip rect {
      fill: var(--text-primary);
      stroke: var(--border-subtle);
    }

    .point-tooltip text {
      fill: var(--surface-page);
      font-size: 11px;
    }

    .point-tooltip .tooltip-value {
      font-size: 13px;
      font-weight: 760;
    }

    /* ---- 4.6 次级统计（更安静的层） ---- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-secondary);
    }

    .stat-name {
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 7px;
      font-size: 21px;
      line-height: 1.15;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .stat-unit {
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 600;
    }

    .stat-note {
      display: inline-flex;
      width: fit-content;
      margin-top: 8px;
      padding: 4px 8px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
    }

    .stats-group-label {
      grid-column: 1 / -1;
      margin-top: 2px;
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.08em;
    }

    .stat.stat-wide {
      grid-column: span 2;
    }

    .stat-value.is-empty {
      color: var(--text-tertiary);
      font-size: 16px;
      font-weight: 700;
    }

    /* ---- 4.7 日历与选中日回顾 ---- */
    .calendar-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .calendar-nav {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .month-title {
      font-size: 17px;
      font-weight: 760;
      letter-spacing: -0.2px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      cursor: pointer;
      background: var(--surface-secondary);
      color: var(--text-primary);
      font-size: 20px;
      line-height: 1;
      transition: background var(--dur-fast) ease;
    }

    .today-jump {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: var(--surface-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 760;
      cursor: pointer;
      transition: background var(--dur-fast) ease;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px 8px;
    }

    .weekday {
      color: var(--text-tertiary);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 0;
    }

    .day {
      position: relative;
      min-height: 44px;
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    }

    .day.empty {
      cursor: default;
    }

    .day.has-record {
      background: var(--accent-soft);
      color: var(--accent-deep);
    }

    .day.selected {
      background: var(--accent);
      color: #fff;
    }

    .day.selected .target-marker {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .day.today:not(.selected)::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateX(-50%);
    }

    .day-target-dots {
      position: absolute;
      left: 50%;
      bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .target-marker {
      width: 7px;
      height: 7px;
      background: var(--border-strong);
      box-shadow: 0 0 0 2px var(--marker-ring);
    }

    .target-marker.metric-intake {
      border-radius: 50%;
    }

    .target-marker.metric-protein {
      border-radius: 2px;
      transform: rotate(45deg);
    }

    .target-marker.metric-weight {
      border-radius: 2px;
      width: 5px;
      height: 9px;
    }

    .review {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      background: var(--surface-secondary);
    }

    .review-date {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 760;
    }

    .review-values {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 8px;
    }

    .review .empty-state {
      padding: 10px 14px;
    }

    .mini {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-primary);
      border: 1px solid var(--border-subtle);
    }

    .mini span {
      display: block;
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 700;
    }

    .mini strong {
      display: block;
      margin-top: 6px;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    /* ---- 4.8 历史记录列表 ---- */
    .records {
      display: grid;
      align-content: start;
      gap: 8px;
      max-height: 480px;
      overflow: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }

    .records::-webkit-scrollbar {
      width: 6px;
    }

    .records::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 999px;
    }

    .record {
      display: grid;
      grid-template-columns: 112px repeat(4, minmax(0, 1fr)) auto;
      align-items: center;
      gap: 8px 14px;
      padding: 11px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      transition: background var(--dur-fast) ease;
    }

    .record-date {
      font-size: 14px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .record-value {
      color: var(--text-tertiary);
      font-size: 12px;
      min-width: 0;
    }

    .record-value strong {
      display: block;
      color: var(--text-primary);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .record-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-self: end;
    }

    .link-btn {
      border: 0;
      border-radius: 10px;
      min-height: 36px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--accent-deep);
      background: transparent;
      font-weight: 700;
      font-size: 13px;
      transition: background var(--dur-fast) ease;
    }

    .delete-btn {
      color: var(--danger);
    }

    .records-more {
      width: 100%;
      margin-top: 2px;
    }

    /* ---- 4.9 导入与备份 ---- */
    .import-help {
      margin: 0 0 10px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }

    .import-preview {
      display: none;
      margin-top: 12px;
    }

    .import-preview.show {
      display: grid;
      gap: 10px;
    }

    .import-preview-title {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .import-preview-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
      padding-right: 4px;
    }

    .import-preview-row {
      display: grid;
      grid-template-columns: minmax(96px, 1.2fr) repeat(4, minmax(76px, 1fr)) auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      background: var(--surface-secondary);
      font-size: 13px;
    }

    .import-preview-row strong {
      display: block;
      color: var(--text-primary);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .import-preview-badge {
      justify-self: end;
      padding: 5px 8px;
      border-radius: 999px;
      color: var(--text-secondary);
      background: var(--surface-primary);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .utility-group-label {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.08em;
    }

    .utility-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .utility-hint {
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 1.5;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* ---- 4.10 数据与备份折叠面板 ---- */
    .data-panel {
      grid-area: data;
    }

    .data-panel > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      cursor: pointer;
      list-style: none;
      font-size: 15px;
      font-weight: 760;
    }

    .data-panel > summary::-webkit-details-marker {
      display: none;
    }

    .data-panel > summary::after {
      content: "›";
      color: var(--text-tertiary);
      font-size: 18px;
      transition: transform var(--dur-fast) var(--ease-out-soft);
    }

    .data-panel[open] > summary::after {
      transform: rotate(90deg);
    }

    .data-panel[open] > .panel-inner {
      border-top: 1px solid var(--border-subtle);
    }

    .data-summary-hint {
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 650;
    }

    /* ---- 4.11 Toast ---- */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      background: var(--toast-bg);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      max-width: 340px;
      opacity: 0;
      transform: translateX(20px);
      animation: toastIn var(--dur-normal) var(--ease-out-soft) forwards;
    }

    .toast.toast-out {
      animation: toastOut var(--dur-fast) var(--ease-out-soft) forwards;
    }

    .toast.error {
      border-left: 4px solid var(--fill-low);
    }

    .toast.success {
      border-left: 4px solid var(--fill-good);
    }

    /* ---- 4.12 宠物伙伴 ---- */
    /* 固定宠物可能与内部滚动列表的行尾操作重叠，给这两处留出宠物净空 */
    .records {
      padding-right: 92px;
    }

    .import-preview-list {
      padding-right: 92px;
    }

    .diet-pet {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: grid;
      justify-items: end;
      gap: 10px;
      pointer-events: none;
    }

    .pet-speech {
      width: min(260px, calc(100vw - 44px));
      padding: 12px 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      background: var(--toast-bg);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition: opacity var(--dur-normal) var(--ease-out-soft), transform var(--dur-normal) var(--ease-out-soft);
      pointer-events: none;
    }

    .pet-speech.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pet-button {
      position: relative;
      width: 72px;
      height: 72px;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      transition: transform var(--dur-fast) var(--ease-out-soft);
    }

    .pet-button:active {
      transform: scale(0.96);
    }

    .pet-art {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.16));
    }

    .pet-button.is-talking .pet-art {
      animation: petBounce 0.42s var(--ease-out-soft);
    }

    .fox-outline {
      stroke: #3f0a7b;
      stroke-width: 4.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-theme="dark"] .fox-outline {
      stroke: #c9a0ff;
    }

    [data-theme="dark"] .fox-purple {
      fill: #c9a0ff;
    }

    .fox-orange {
      fill: #ff9f2d;
    }

    .fox-white {
      fill: #fffafd;
    }

    .fox-pink {
      fill: #ff6f8e;
    }

    .fox-heart {
      fill: #f72576;
    }

    .fox-heart-shadow {
      fill: #c91867;
      opacity: 0.72;
    }

    .fox-purple {
      fill: #3f0a7b;
    }

    .fox-pad {
      fill: #ff706d;
    }

    .fox-shadow {
      fill: rgba(29, 29, 31, 0.22);
    }

    [data-theme="dark"] .fox-shadow {
      fill: rgba(0, 0, 0, 0.5);
    }

    /* ============================================================
       5. Utilities / States
       ============================================================ */
    .summary-value,
    .stat-value,
    .stat-unit,
    .trend-chip strong,
    .tooltip-value,
    .record-value strong,
    .review-values strong {
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       6. Motion
       ============================================================ */
    @keyframes toastIn {
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      to { opacity: 0; transform: translateX(20px); }
    }

    @keyframes savePulse {
      0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(48, 209, 88, 0); }
      100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
    }

    .save-pulse {
      animation: savePulse 0.5s var(--ease-out-soft);
    }

    @keyframes numberPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .number-pop {
      animation: numberPop var(--dur-normal) var(--ease-out-soft);
      transform-origin: left center;
    }

    @keyframes petBounce {
      0% { transform: scale(1); }
      45% { transform: scale(1.07) rotate(-2deg); }
      100% { transform: scale(1); }
    }

    @keyframes petFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .pet-art {
      animation: petFloat 5s ease-in-out infinite;
    }

    .pet-button.is-talking .pet-art {
      animation: petBounce 0.42s var(--ease-out-soft);
    }

    /* 悬停行为仅在真正支持悬停的指针设备上启用 */
    @media (hover: hover) and (pointer: fine) {
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(10, 132, 255, 0.26);
      }

      .btn.secondary:hover,
      .btn.quiet:hover {
        box-shadow: inset 0 0 0 1px var(--border-subtle);
        background: var(--surface-hover);
      }

      .btn.quiet:hover {
        color: var(--text-primary);
      }

      .range-btn:hover {
        background: var(--surface-hover);
      }

      .range-btn.active:hover {
        background: var(--accent);
      }

      .icon-btn:hover,
      .today-jump:hover {
        background: var(--surface-hover);
      }

      .link-btn:hover {
        background: var(--surface-hover);
      }

      .day:hover {
        background: var(--surface-hover);
      }

      .day.empty:hover {
        background: transparent;
      }

      .day.selected:hover {
        background: var(--accent);
      }

      .record:hover {
        background: var(--surface-hover);
      }
    }

    /* ============================================================
       7. Responsive
       ============================================================ */
    @media (min-width: 768px) and (max-width: 1199px) {
      .app {
        grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 1199px) {
      .record {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-areas:
          "date date date actions"
          "v1 v2 v3 v4";
      }

      .record-date {
        grid-area: date;
      }

      .record > .record-value:nth-child(2) { grid-area: v1; }
      .record > .record-value:nth-child(3) { grid-area: v2; }
      .record > .record-value:nth-child(4) { grid-area: v3; }
      .record > .record-value:nth-child(5) { grid-area: v4; }

      .record-actions {
        grid-area: actions;
        align-self: center;
      }

      .chart-card .empty-state {
        padding: 22px 16px;
      }
    }

    @media (max-width: 767px) {
      .app {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: min(100% - 28px, 1400px);
        padding: 14px 0 110px;
      }

      .app-header {
        flex-wrap: wrap;
        padding: 14px 16px;
      }

      .header-side {
        margin-left: auto;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }

      .trend-summary {
        grid-template-columns: 1fr;
      }

      .target-progress {
        grid-template-columns: 1fr;
      }

      .calendar {
        gap: 6px;
      }

      .day {
        border-radius: 11px;
        font-size: 13px;
      }

      .link-btn {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .import-preview-row {
        grid-template-columns: 1fr;
      }

      .import-preview-badge {
        justify-self: start;
      }

      /* 移动端记录卡：操作按钮独占整行，避免与日期列挤压换行 */
      .record {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "date date"
          "v1 v2"
          "v3 v4"
          "actions actions";
      }

      .record-actions {
        justify-self: end;
      }

      .diet-pet {
        right: 8px;
      }

      .pet-button {
        width: 58px;
        height: 58px;
      }

      .pet-speech {
        width: min(230px, calc(100vw - 24px));
        font-size: 12px;
      }

      .records,
      .import-preview-list {
        padding-right: 66px;
      }
    }

    @media (max-width: 390px) {
      .app {
        width: min(100% - 20px, 1400px);
      }

      .panel-inner {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="storage-warning" id="storageWarning" role="alert" hidden></div>

    <header class="app-header">
      <div class="brand-block">
        <h1 class="brand-title">NutriFlow<span class="brand-cn">每日饮食记录</span></h1>
        <div class="header-meta">
          <span class="privacy-chip"><span class="privacy-dot" aria-hidden="true"></span>本地存储 · 不上传</span>
          <span>记录摄入、体重、蛋白质和饮水</span>
        </div>
      </div>
      <div class="header-side">
        <span class="today-pill" id="todayText">今天</span>
        <button class="icon-btn theme-btn" type="button" id="themeToggle" aria-label="切换深色模式"> </button>
      </div>
    </header>

    <section class="panel entry-panel">
      <div class="panel-inner">
        <h2 id="formTitle">填写今天</h2>
        <form class="form" id="recordForm">
          <label>
            日期
            <input id="dateInput" type="date" required>
          </label>
          <label>
            摄入 kcal（必填）
            <input id="intakeInput" type="number" min="0" step="1" placeholder="例如 2100" required>
          </label>
          <div class="field-row">
            <label>
              体重 kg（可不填）
              <input id="weightInput" type="number" min="0" step="0.1" placeholder="例如 68.5">
            </label>
            <label>
              蛋白质 g（可不填）
              <input id="proteinInput" type="number" min="0" step="0.1" placeholder="例如 120">
            </label>
          </div>
          <div class="water-block">
            <label>
              饮水 ml（可不填）
              <input id="waterInput" type="number" min="0" step="10" placeholder="例如 2000">
            </label>
            <div class="quick-fill" role="group" aria-label="饮水快捷加减">
              <button class="chip-step" type="button" data-water-step="-250">−250</button>
              <button class="chip-step" type="button" data-water-step="250">+250</button>
              <button class="chip-step" type="button" data-water-step="500">+500</button>
            </div>
          </div>
          <div class="button-row">
            <button class="btn" type="submit">保存记录</button>
            <button class="btn secondary" type="button" id="copyLatestBtn" title="把最近一条已有记录的数值带入当前表单">复制上次</button>
            <button class="btn secondary" type="button" id="clearFormBtn">清空输入</button>
          </div>
          <p class="message" id="formMessage"></p>
        </form>
        <div class="target-progress" id="targetProgress"></div>
        <details class="target-settings">
          <summary>每日目标与身体数据</summary>
          <div class="target-fields">
            <div class="field-row">
              <label>
                热量目标 kcal
                <input id="targetIntakeInput" type="number" min="0" step="1" placeholder="例如 1500">
              </label>
              <label>
                蛋白目标 g
                <input id="targetProteinInput" type="number" min="0" step="0.1" placeholder="例如 100">
              </label>
            </div>
            <div class="field-row">
              <label>
                身高 cm（用于 BMI）
                <input id="heightInput" type="number" min="0" step="0.1" placeholder="例如 170">
              </label>
              <label>
                饮水目标 ml
                <input id="targetWaterInput" type="number" min="0" step="10" placeholder="例如 2000">
              </label>
            </div>
            <div class="button-row">
              <button class="btn secondary" type="button" id="saveTargetsBtn">保存目标</button>
            </div>
            <p class="message" id="targetMessage"></p>
          </div>
          <div class="target-legend" aria-label="日历颜色说明">
            <span>日历小点：圆点热量，菱形蛋白</span>
            <span><i class="legend-dot good"></i>达标</span>
            <span><i class="legend-dot warn"></i>稍低</span>
            <span><i class="legend-dot low"></i>偏低</span>
            <span><i class="legend-dot none"></i>未填</span>
          </div>
        </details>
      </div>
    </section>

    <section class="panel overview-panel">
      <div class="panel-inner">
        <h2>今日概览</h2>
        <div class="today-summary" id="todaySummary" aria-label="今天状态"></div>
        <h2 class="section-title">趋势</h2>
        <div class="charts" id="charts"></div>
      </div>
    </section>

    <section class="panel calendar-panel">
      <div class="panel-inner">
        <h2>日历</h2>
        <div class="calendar-tools">
          <div class="calendar-nav">
            <button class="icon-btn" type="button" id="prevMonthBtn" aria-label="上个月">‹</button>
            <div class="month-title" id="monthTitle"></div>
            <button class="icon-btn" type="button" id="nextMonthBtn" aria-label="下个月">›</button>
          </div>

  <script>
    const STORAGE_KEY = "dailyDietRecordsV1";
    const CORRUPT_RECORDS_BACKUP_KEY = "dailyDietRecordsV1CorruptBackupV1";
    const CORRUPT_RECORDS_BACKUP_V2_KEY = "dailyDietRecordsV1CorruptBackupV2";
    const RESTORE_JOURNAL_KEY = "dailyDietRestoreJournalV1";
    const TARGET_STORAGE_KEY = "dailyDietTargetsV1";
    const METRIC_POLICIES = {
      "热量": { type: "minimum" },
      "蛋白": { type: "minimum" },
      "饮水": { type: "minimum" }
    };
    const PET_LINES = [

      "今天吃够蛋白，明天少点馋嘴谈判。",
      "体重波动像天气，趋势才像季节。",

      "别饿到发脾气，减脂也要讲礼貌。",
      "认真记录的人，已经赢过随缘派了。"
    ];
    const recordsByDate = new Map();
    const dateInput = document.querySelector("#dateInput");
    const intakeInput = document.querySelector("#intakeInput");
    const weightInput = document.querySelector("#weightInput");
    const proteinInput = document.querySelector("#proteinInput");
    const formTitle = document.querySelector("#formTitle");
    const formMessage = document.querySelector("#formMessage");
    const storageWarning = document.querySelector("#storageWarning");
    const importText = document.querySelector("#importText");
    const importMessage = document.querySelector("#importMessage");
    const importPreview = document.querySelector("#importPreview");
    const confirmImportBtn = document.querySelector("#confirmImportBtn");
    const stats = document.querySelector("#stats");
    const charts = document.querySelector("#charts");
    const calendar = document.querySelector("#calendar");
    const monthTitle = document.querySelector("#monthTitle");
    const reviewBox = document.querySelector("#reviewBox");
    const recordsBox = document.querySelector("#records");
    const todayText = document.querySelector("#todayText");
    const todaySummary = document.querySelector("#todaySummary");
    const petButton = document.querySelector("#petButton");
    const petSpeech = document.querySelector("#petSpeech");
    const waterInput = document.querySelector("#waterInput");
    const targetIntakeInput = document.querySelector("#targetIntakeInput");
    const targetProteinInput = document.querySelector("#targetProteinInput");
    const heightInput = document.querySelector("#heightInput");
    const targetWaterInput = document.querySelector("#targetWaterInput");
    const targetMessage = document.querySelector("#targetMessage");
    const saveTargetsBtn = document.querySelector("#saveTargetsBtn");
    const targetProgress = document.querySelector("#targetProgress");

    let today = toDateString(new Date());
    let selectedDate = today;
    let calendarYear = Number(today.slice(0, 4));
    let calendarMonth = Number(today.slice(5, 7)) - 1;
    let pendingImportRecords = [];
    let corruptRecordsRaw = "";
    let corruptRecordsStatus = "";
    let storageUnavailable = false;
    let restoreRecoveryPending = false;
    let lastPetLineIndex = -1;
    let petSpeechTimer = null;
    let dailyTargets = { intake: "", protein: "", height: "", water: "" };
    let chartRange = 30;
    let chartView = "line";

    function toDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDateText(dateString) {
      const [year, month, day] = dateString.split("-");
      return `${year}年${Number(month)}月${Number(day)}日`;
    }

    function readNumber(value, required) {
      const trimmed = String(value ?? "").trim();
      if (!trimmed) return required ? null : "";
      const number = Number(trimmed);
      if (!Number.isFinite(number) || number < 0) return null;
      return number;
    }

    function normalizeRecord(record) {
      if (!record || !isValidDate(record.date)) return null;
      const intake = readNumber(record.intake, true);
      const weight = readNumber(record.weight ?? "", false);
      const protein = readNumber(record.protein ?? "", false);
      const water = readNumber(record.water ?? "", false);
      if (intake === null || weight === null || protein === null || water === null) return null;
      return { date: record.date, intake, weight, protein, water };
    }

    function normalizeTargetsObject(raw) {
      const source = raw && typeof raw === "object" ? raw : {};
      const readTarget = (value) => Number.isFinite(Number(value)) && Number(value) > 0 ? Number(value) : "";
      return {
        intake: readTarget(source.intake),
        protein: readTarget(source.protein),
        height: readTarget(source.height),
        water: readTarget(source.water)
      };
    }

    function syncTargetInputs() {
      targetIntakeInput.value = dailyTargets.intake === "" ? "" : dailyTargets.intake;
      targetProteinInput.value = dailyTargets.protein === "" ? "" : dailyTargets.protein;
      heightInput.value = dailyTargets.height === "" ? "" : dailyTargets.height;
      targetWaterInput.value = dailyTargets.water === "" ? "" : dailyTargets.water;
    }

    function writeTargets(targets) {
      return storageSet(TARGET_STORAGE_KEY, JSON.stringify(targets)) === true;
    }

    function writeStorageDirect(key, value) {
      try {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
        return true;
      } catch (error) {
        return false;
      }
    }

    function storageRemove(key) {
      try {
        localStorage.removeItem(key);
        return true;
      } catch (error) {
        if (error && error.name === "SecurityError") storageUnavailable = true;
        return false;
      }
    }

    function restoreFullBackup(backup) {
      if (!backup || !Array.isArray(backup.records)) return false;
      if (backup.schemaVersion !== undefined && backup.schemaVersion !== 1) return false;
      const recordsSnapshot = new Map(recordsByDate);
      const targetsSnapshot = { ...dailyTargets };
      const themeSnapshot = document.documentElement.getAttribute("data-theme") || "light";
      const corruptRawSnapshot = corruptRecordsRaw;
      const corruptStatusSnapshot = corruptRecordsStatus;
      const oldRecords = storageGet(STORAGE_KEY);
      const oldTargets = storageGet(TARGET_STORAGE_KEY);
      const oldTheme = storageGet(THEME_KEY);

      const journal = {
        schemaVersion: 1,
        savedAt: new Date().toISOString(),
        records: oldRecords,
        targets: oldTargets,
        theme: oldTheme
      };
      if (storageSet(RESTORE_JOURNAL_KEY, JSON.stringify(journal)) !== true) return false;

      recordsByDate.clear();
      backup.records.forEach((record) => recordsByDate.set(record.date, record));
      dailyTargets = normalizeTargetsObject(backup.targets);
      const restoreTheme = backup.preferences && backup.preferences.theme === "dark" ? "dark" : "light";
      applyTheme(restoreTheme);
      syncTargetInputs();

      const recordsSaved = saveRecords();
      const targetsSaved = writeTargets(dailyTargets);
      const themeSaved = storageSet(THEME_KEY, restoreTheme) === true;
      if (recordsSaved && targetsSaved && themeSaved) {
        if (storageRemove(RESTORE_JOURNAL_KEY)) return true;
        restoreRecoveryPending = true;
      }

      recordsByDate.clear();
      recordsSnapshot.forEach((record, date) => recordsByDate.set(date, record));
      dailyTargets = targetsSnapshot;
      applyTheme(themeSnapshot);
      syncTargetInputs();
      corruptRecordsRaw = corruptRawSnapshot;
      corruptRecordsStatus = corruptStatusSnapshot;
      let rollbackOk = true;
      if (recordsSaved) rollbackOk = writeStorageDirect(STORAGE_KEY, oldRecords) && rollbackOk;
      if (targetsSaved) rollbackOk = writeStorageDirect(TARGET_STORAGE_KEY, oldTargets) && rollbackOk;
      if (themeSaved) rollbackOk = writeStorageDirect(THEME_KEY, oldTheme) && rollbackOk;
      if (rollbackOk && storageRemove(RESTORE_JOURNAL_KEY)) {
        restoreRecoveryPending = false;
      } else {
        restoreRecoveryPending = true;
      }
      return false;
    }

    function isValidRestoreJournal(journal) {
      if (!journal || typeof journal !== "object") return false;
      if (journal.schemaVersion !== 1) return false;
      if (!Object.prototype.hasOwnProperty.call(journal, "records")) return false;
      if (!Object.prototype.hasOwnProperty.call(journal, "targets")) return false;
      if (!Object.prototype.hasOwnProperty.call(journal, "theme")) return false;
      return [journal.records, journal.targets, journal.theme].every((value) => value === null || typeof value === "string");
    }

    function recoverRestoreJournal() {
      const raw = storageGet(RESTORE_JOURNAL_KEY);
      if (!raw) {
        restoreRecoveryPending = false;
        return true;
      }
      let journal;
      try {
        journal = JSON.parse(raw);
      } catch (error) {
        restoreRecoveryPending = true;
        return false;
      }
      if (!isValidRestoreJournal(journal)) {
        restoreRecoveryPending = true;
        return false;
      }
      const recordsOk = writeStorageDirect(STORAGE_KEY, journal.records);
      const targetsOk = writeStorageDirect(TARGET_STORAGE_KEY, journal.targets);
      const themeOk = writeStorageDirect(THEME_KEY, journal.theme);
      if (recordsOk && targetsOk && themeOk) {
        if (!storageRemove(RESTORE_JOURNAL_KEY)) {
          restoreRecoveryPending = true;
          return false;
        }
        restoreRecoveryPending = false;
        loadRecords();
        loadTargets();
        applyTheme(storageGet(THEME_KEY) === "dark" ? "dark" : "light");
        return true;
      }
      restoreRecoveryPending = true;
      return false;
    }

    function ensureRestoreRecovery() {
      if (!restoreRecoveryPending) return true;
      if (recoverRestoreJournal()) return true;
      showToast("存在未完成的恢复日志，已暂停新的保存操作。请勿清除站点数据，刷新后会自动重试恢复。", "error");
      renderStorageStatus();
      return false;
    }

    function setMessage(element, text, type) {
      element.textContent = text;
      element.className = `message ${type || ""}`;
      if (text && type) showToast(text, type);
    }

    function storageGet(key) {
      try { return localStorage.getItem(key); }
      catch (error) { storageUnavailable = true; return null; }
    }

    function storageSet(key, value) {
      if (restoreRecoveryPending && !ensureRestoreRecovery()) return false;
      if (storageUnavailable) return "memory";
      try { localStorage.setItem(key, value); return true; }
      catch (error) {
        if (error && error.name === "SecurityError") storageUnavailable = true;
        return storageUnavailable ? "memory" : false;
      }
    }

    function applyRecordMutationAndSave(mutate) {
      const snapshot = { records: new Map(recordsByDate), selectedDate, calendarYear, calendarMonth };
      mutate();
      const saved = saveRecords();
      if (saved) return saved;
      recordsByDate.clear();
      snapshot.records.forEach((record, date) => recordsByDate.set(date, record));
      selectedDate = snapshot.selectedDate;
      calendarYear = snapshot.calendarYear;
      calendarMonth = snapshot.calendarMonth;
      return false;
    }

    function showToast(text, type) {
      const container = document.querySelector("#toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type || ""}`;
      toast.setAttribute("role", type === "error" ? "alert" : "status");
      toast.textContent = text;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("toast-out");
        toast.addEventListener("animationend", () => toast.remove());
      }, 3000);
    }

    function clearImportPreview() {
      pendingImportRecords = [];
      importPreview.classList.remove("show");
      importPreview.innerHTML = "";
    }

    function loadRecords() {
      recordsByDate.clear();
      const saved = storageGet(STORAGE_KEY);
      if (!saved) return;

      try {
        const records = JSON.parse(saved);
        if (!Array.isArray(records)) {
          corruptRecordsRaw = saved;
          corruptRecordsStatus = "全部无法读取";
          return;
        }
        const dates = new Set();
        let hasRejectedRecord = false;
        records.forEach((record) => {
          const normalized = normalizeRecord(record);
          if (!normalized || dates.has(normalized.date)) {
            hasRejectedRecord = true;
            return;
          }
          dates.add(normalized.date);
          recordsByDate.set(normalized.date, normalized);
        });
        if (hasRejectedRecord) {
          corruptRecordsRaw = saved;
          corruptRecordsStatus = "部分记录无效或重复";
        }
      } catch (error) {
        recordsByDate.clear();
        corruptRecordsRaw = saved;
        corruptRecordsStatus = "全部无法读取";
      }
    }

    function storeCorruptRecordsBackup() {
      if (!corruptRecordsRaw) return true;
      const previousBackup = storageGet(CORRUPT_RECORDS_BACKUP_KEY);
      if (previousBackup === null || previousBackup === corruptRecordsRaw) {
        return storageSet(CORRUPT_RECORDS_BACKUP_KEY, corruptRecordsRaw) === true;
      }

      let archive = [];
      try {
        const parsed = JSON.parse(storageGet(CORRUPT_RECORDS_BACKUP_V2_KEY) || "[]");
        if (Array.isArray(parsed)) archive = parsed;
      } catch (error) {
        archive = [];
      }
      archive.push({ savedAt: new Date().toISOString(), raw: corruptRecordsRaw });
      if (archive.length > 10) archive = archive.slice(-10);
      return storageSet(CORRUPT_RECORDS_BACKUP_V2_KEY, JSON.stringify(archive)) === true;
    }

    function saveRecords() {
      try {
        if (corruptRecordsRaw && !storeCorruptRecordsBackup()) return false;
        const saved = storageSet(STORAGE_KEY, JSON.stringify(getSortedRecords()));
        if (saved !== true) return false;
        corruptRecordsRaw = "";
        corruptRecordsStatus = "";
        return true;
      } catch (error) {
        return false;
      }
    }

    function saveRecordsMessage() {
      return corruptRecordsRaw
        ? "原始异常数据尚未备份：请先处理 dailyDietRecordsV1CorruptBackupV1 后再保存。"
        : "浏览器未能保存记录，请检查存储空间或权限后重试。";
    }

    function loadTargets() {
      try {
        const saved = JSON.parse(storageGet(TARGET_STORAGE_KEY) || "{}");
        dailyTargets = normalizeTargetsObject(saved);
      } catch (error) {
        dailyTargets = { intake: "", protein: "", height: "", water: "" };
      }
      syncTargetInputs();
    }

    function saveTargets() {
      const intake = readNumber(targetIntakeInput.value, false);
      const protein = readNumber(targetProteinInput.value, false);
      const height = readNumber(heightInput.value, false);
      const water = readNumber(targetWaterInput.value, false);

      if (intake === null || protein === null || height === null || water === null) {
        setMessage(targetMessage, "目标需要填写大于或等于 0 的数字，也可以留空。", "error");
        return;
      }

      const previousTargets = { ...dailyTargets };
      dailyTargets = {
        intake: intake === 0 ? "" : intake,
        protein: protein === 0 ? "" : protein,
        height: height === 0 ? "" : height,
        water: water === 0 ? "" : water
      };
      if (!writeTargets(dailyTargets)) {
        dailyTargets = previousTargets;
        syncTargetInputs();
        setMessage(targetMessage, "浏览器未能保存目标，请检查存储空间或权限后重试。", "error");
        render();
        return;
      }
      syncTargetInputs();
      setMessage(targetMessage, "目标已保存，日历颜色已更新。", "success");
      render();
    }

    function getSortedRecords() {
      return Array.from(recordsByDate.values()).sort((a, b) => a.date.localeCompare(b.date));
    }

    function recordsInLastCalendarDays(records, days) {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      now.setDate(now.getDate() - (days - 1));
      const cutoff = toDateString(now);
      const todayStr = toDateString(new Date());
      return records.filter((record) => record.date >= cutoff && record.date <= todayStr);
    }

    function isValidDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const date = new Date(`${value}T00:00:00`);
      return !Number.isNaN(date.getTime()) && toDateString(date) === value;
    }

    function normalizeDate(value) {
      const clean = String(value ?? "")
        .trim()
        .replace(/年|[./、]/g, "-")
        .replace(/月/g, "-")
        .replace(/日/g, "")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      const fullDate = clean.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      const shortDate = clean.match(/^(\d{1,2})-(\d{1,2})$/);
      let date = "";

      if (fullDate) {
        date = `${fullDate[1]}-${fullDate[2].padStart(2, "0")}-${fullDate[3].padStart(2, "0")}`;
      } else if (shortDate) {
        date = `${today.slice(0, 4)}-${shortDate[1].padStart(2, "0")}-${shortDate[2].padStart(2, "0")}`;
      }

      return isValidDate(date) ? date : "";
    }

    function recordFromInputs() {
      const date = dateInput.value;
      const intake = readNumber(intakeInput.value, true);
      const weight = readNumber(weightInput.value, false);
      const protein = readNumber(proteinInput.value, false);
      const water = readNumber(waterInput.value, false);

      if (!isValidDate(date)) return { error: "请选择正确的日期。" };
      if (intake === null) return { error: "摄入是必填项，请填写一个大于或等于 0 的数字。" };
      if (weight === null) return { error: "体重如果填写，需要是大于或等于 0 的数字。" };
      if (protein === null) return { error: "蛋白质如果填写，需要是大于或等于 0 的数字。" };
      if (water === null) return { error: "饮水如果填写，需要是大于或等于 0 的数字。" };

      return { date, intake, weight, protein, water };
    }

    function fillForm(record) {
      dateInput.value = record.date;
      intakeInput.value = record.intake;
      weightInput.value = record.weight === "" ? "" : record.weight;
      proteinInput.value = record.protein === "" ? "" : record.protein;
      waterInput.value = record.water === "" || record.water === undefined ? "" : record.water;
    }

    function clearFormForDate(date) {
      dateInput.value = date;
      intakeInput.value = "";
      weightInput.value = "";
      proteinInput.value = "";
      waterInput.value = "";
    }

    function refreshToday() {
      const nextToday = toDateString(new Date());
      if (nextToday === today) return;
      const previousToday = today;
      today = nextToday;
      todayText.textContent = `今天：${formatDateText(today)}`;
      if (selectedDate === previousToday && dateInput.value === previousToday && !intakeInput.value && !weightInput.value && !proteinInput.value && !waterInput.value) {
        selectedDate = today;
        calendarYear = Number(today.slice(0, 4));
        calendarMonth = Number(today.slice(5, 7)) - 1;
        clearFormForDate(today);
      }
      render();
    }

    function scheduleTodayRefresh() {
      const next = new Date();
      next.setHours(24, 0, 1, 0);
      window.setTimeout(() => {
        refreshToday();
        scheduleTodayRefresh();
      }, next - new Date());
    }

    // 标签页休眠跨天后恢复：定时器可能已被节流或丢失，唤醒时立即重算今天。
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshToday();
    });
    window.addEventListener("pageshow", refreshToday);

    function updateFormTitle() {
      formTitle.textContent = selectedDate === today ? "今天记录" : `编辑 ${formatDateText(selectedDate)}`;
    }

    function renderStorageStatus() {
      if (restoreRecoveryPending) {
        storageWarning.hidden = false;
        storageWarning.textContent = "检测到未完成的恢复日志。为保护旧数据，已暂停新的保存操作；请勿清除站点数据，刷新后会自动重试恢复。";
      } else if (storageUnavailable) {
        storageWarning.hidden = false;
        storageWarning.textContent = "当前浏览器无法保存到本地存储：页面只能临时使用，关闭后数据可能丢失。";
      } else {
        storageWarning.hidden = true;
      }
    }
    let chartMetric = "intake";
    let recordsVisibleLimit = 60;
    const RECORDS_PAGE = 60;
    const HOVER_POINT_LIMIT = 400;
    const previousStatValues = new Map();
    const previousKpiValues = new Map();
    let targetProgressSignature = "";

    function prefersReducedMotion() {
      return Boolean(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    }

    // 日期序数：基于 UTC 天数差，避免依赖本地零点的毫秒除法。
    function dayOrdinal(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return Math.round(Date.UTC(year, month - 1, day) / 86400000);
    }

    function daysBetween(startDate, endDate) {
      return dayOrdinal(endDate) - dayOrdinal(startDate);
    }

    function dateShiftedByDays(dateString, days) {
      return new Date((dayOrdinal(dateString) + days) * 86400000).toISOString().slice(0, 10);
    }

    function render() {
      const sorted = getSortedRecords();
      const habitReview = sorted.length ? recordHabitReview(sorted) : "";
      updateFormTitle();
      renderStorageStatus();
      renderTodayKpis(sorted);
      renderStats(sorted, habitReview);
      renderCharts();
      renderCalendar();
      renderReview();
      renderTargetProgress();
      recordsVisibleLimit = RECORDS_PAGE;
      renderRecords(sorted);
    }

    // 选中日期变化只刷新表单标题、日历与回顾，不重建图表和历史列表。
    function updateSelectedDayUI() {
      updateFormTitle();
      renderCalendar();
      renderReview();
    }

    function valueOrEmpty(value, unit) {
      return value === "" || !Number.isFinite(Number(value)) ? "未填写" : `${roundValue(Number(value))} ${unit}`;
    }

    function targetNoteForToday(record, key, label) {
      if (!record) return "保存后这里会更新";
      let target, unit;
      if (key === "intake") { target = dailyTargets.intake; unit = "kcal"; }
      else if (key === "protein") { target = dailyTargets.protein; unit = "g"; }
      else if (key === "water") { target = dailyTargets.water; unit = "ml"; }
      else return "目标还没有设置";
      if (target === "" || !Number.isFinite(Number(target)) || Number(target) <= 0) return "还没有设置目标";
      const value = record[key] === undefined ? "" : record[key];
      const check = metricTargetStatus(label, value, target, unit);
      return check ? check.text : "目标还没有设置";
    }

    function calculateBMI(weight, height) {
      if (!weight || !height || weight === "" || height === "") return null;
      const w = Number(weight);
      const h = Number(height) / 100;
      if (w <= 0 || h <= 0) return null;
      return w / (h * h);
    }

    function bmiCategory(bmi) {
      if (bmi === null) return "";
      if (bmi < 18.5) return "偏瘦";
      if (bmi < 24) return "正常";
      if (bmi < 28) return "偏胖";
      return "肥胖";
    }


    function renderTodayKpis(sorted) {
      const todayRecord = recordsByDate.get(today);
      const weeklyWeightChange = averageWeeklyWeightChange(sorted);
      const kpis = [
        { label: "今日摄入", value: todayRecord ? valueOrEmpty(todayRecord.intake, "kcal") : "未填写", note: targetNoteForToday(todayRecord, "intake", "热量") },
        { label: "今日蛋白", value: todayRecord ? valueOrEmpty(todayRecord.protein, "g") : "未填写", note: targetNoteForToday(todayRecord, "protein", "蛋白") },
        { label: "今日饮水", value: todayRecord ? valueOrEmpty(todayRecord.water ?? "", "ml") : "未填写", note: targetNoteForToday(todayRecord, "water", "饮水") },
        {
          label: "体重趋势",
          value: latestWeightValue(sorted) === null ? "未填写" : `${roundValue(latestWeightValue(sorted))} kg`,
          note: weeklyWeightChange === null ? "记录体重后显示周变化" : weightTrendReview(sorted, weeklyWeightChange) || `周变化 ${formatSignedValue(weeklyWeightChange)} kg`
        }
      ];

      todaySummary.innerHTML = kpis.map((kpi) => {
        const previous = previousKpiValues.get(kpi.label);
        const changed = previous !== undefined && previous !== kpi.value;
        previousKpiValues.set(kpi.label, kpi.value);
        return `
          <div class="summary-card">
            <span class="summary-label">${kpi.label}</span>
            <strong class="summary-value${changed ? " number-pop" : ""}">${kpi.value}</strong>
            <span class="summary-note">${kpi.note}</span>
          </div>
        `;
      }).join("");
    }

    function renderStats(sorted, habitReview) {
      if (!sorted.length) {
        stats.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">还没有记录。先保存今天的摄入，趋势会立刻出现。</div>
        `;
        return;
      }

      const latest = sorted[sorted.length - 1];
      const averageProtein = averageFilledValue(sorted, "protein");
      const averageWater = averageFilledValue(sorted, "water");
      const weeklyWeightChange = averageWeeklyWeightChange(sorted);
      const weeklyWeightReview = weightTrendReview(sorted, weeklyWeightChange);
      const bmi = calculateBMI(latest.weight, dailyTargets.height);
      const bmiText = bmi === null ? "未填" : roundValue(bmi);
      const bmiNote = bmi === null ? "设置身高后显示" : bmiCategory(bmi);

      const latestGroup = [
        statCard("最近摄入", latest.intake, "kcal", ""),
        statCard("最近体重", latest.weight === "" ? "未填" : latest.weight, latest.weight === "" ? "" : "kg"),
        statCard("最近蛋白质", latest.protein === "" ? "未填" : latest.protein, latest.protein === "" ? "" : "g"),
        statCard("最近饮水", (latest.water === "" || latest.water === undefined) ? "未填" : latest.water, (latest.water === "" || latest.water === undefined) ? "" : "ml"),
      ];

      const last7 = recordsInLastCalendarDays(sorted, 7);
      const avgIntake7 = averageFilledValue(last7, "intake");
      const rate = weeklyTargetRate(last7, dailyTargets.intake, "热量", "kcal");
      const proteinRate = weeklyTargetRate(last7, dailyTargets.protein, "蛋白", "g");
      const weekGroup = [
        statCard("近 7 天达标", rate.text, "", rate.note === "近 7 天" ? "" : rate.note),
        statCard("近 7 天蛋白达标", proteinRate.text, "", proteinRate.note === "近 7 天" ? "" : proteinRate.note),
        statCard("平均摄入", avgIntake7 === null ? "--" : roundValue(avgIntake7), avgIntake7 === null ? "" : "kcal/天"),
      ];

      const trendGroup = [
        statCard("平均周体重变化", weeklyWeightChange === null ? "未填" : formatSignedValue(weeklyWeightChange), weeklyWeightChange === null ? "" : "kg/周", weeklyWeightReview, "stat-compact"),
      ];

      if (dailyTargets.height) {
        trendGroup.push(statCard("BMI", bmiText, "", bmiNote, "stat-compact"));
      }

      trendGroup.push(
        statCard("平均蛋白", averageProtein === null ? "未填" : roundValue(averageProtein), averageProtein === null ? "" : "g/天", "", "stat-compact"),
        statCard("平均饮水", averageWater === null ? "未填" : roundValue(averageWater), averageWater === null ? "" : "ml/天", "", "stat-compact"),
        statCard("已记录", sorted.length, "天", habitReview, "stat-compact stat-wide"),
      );

      stats.innerHTML = [
        statsGroupLabel("最近一天"),
        ...latestGroup,
        statsGroupLabel("近 7 天达成"),
        ...weekGroup,
        statsGroupLabel("长期趋势"),
        ...trendGroup,
      ].join("");
    }

    function averageFilledValue(records, key) {
      const values = records
        .map((record) => record[key])
        .filter((value) => value !== "" && Number.isFinite(Number(value)))
        .map(Number);

      if (!values.length) return null;
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function weeklyTargetRate(records, target, targetMetricName, targetUnit) {
      if (!target || !Number(target)) return { text: "--", note: "未设目标" };
      const dataKey = targetMetricName === "热量" ? "intake" : targetMetricName === "蛋白" ? "protein" : "water";
      const withData = records.filter((record) => record[dataKey] !== "");
      if (!withData.length) return { text: "--", note: "暂无数据" };
      const hit = withData.filter(r => {
        const s = metricTargetStatus(targetMetricName, r[dataKey], target, targetUnit);
        return s && s.level === "good";
      }).length;
      return { text: `${hit}/${withData.length}`, note: "近 7 天" };
    }

    function averageWeeklyWeightChange(records) {
      const weightPoints = records
        .filter((record) => record.weight !== "" && Number.isFinite(Number(record.weight)))
        .map((record) => ({ date: record.date, value: Number(record.weight) }));

      if (weightPoints.length < 2) return null;

      const first = weightPoints[0];
      const last = weightPoints[weightPoints.length - 1];
      const days = daysBetween(first.date, last.date);
      if (days <= 0) return null;

      return ((last.value - first.value) / days) * 7;
    }

    function consecutiveRecordDays(records) {
      if (!records.length) return 0;
      const lastGap = daysBetween(records[records.length - 1].date, toDateString(new Date()));
      if (lastGap < 0 || lastGap > 1) return 0;

      let streak = 1;
      for (let index = records.length - 1; index > 0; index -= 1) {
        if (daysBetween(records[index - 1].date, records[index].date) !== 1) break;
        streak += 1;
      }
      return streak;
    }

    function recordHabitReview(records) {
      const streak = consecutiveRecordDays(records);
      if (streak >= 30) return `优秀连续 · ${streak} 天`;
      if (streak >= 14) return `很稳 · 连续 ${streak} 天`;
      if (streak >= 7) return `良好 · 连续 ${streak} 天`;
      if (streak >= 3) return `保持中 · 连续 ${streak} 天`;
      if (records.length >= 14) return "有积累 · 继续连起来";
      return "刚起步 · 先记满 3 天";
    }


    function latestWeightValue(records) {
      for (let index = records.length - 1; index >= 0; index -= 1) {
        const record = records[index];
        if (record.weight !== "" && Number.isFinite(Number(record.weight))) return Number(record.weight);
      }
      return null;
    }

    function weightTrendReview(records, weeklyChange) {
      const latestWeight = latestWeightValue(records);
      if (weeklyChange === null || latestWeight === null || latestWeight <= 0) return "";
      if (Math.abs(weeklyChange) <= 0.1) return "稳定 · 波动很小";
      if (weeklyChange > 0) return "回升中 · 看看热量和活动";

      const weeklyLossPercent = Math.abs(weeklyChange) / latestWeight * 100;
      const percentText = `${roundValue(weeklyLossPercent)}%/周`;

      if (weeklyLossPercent < 0.25) return `偏慢 · 约 ${percentText}`;
      if (weeklyLossPercent < 0.5) return `良好 · 约 ${percentText}`;
      if (weeklyLossPercent <= 1) return `优秀 · 约 ${percentText}`;
      if (weeklyLossPercent <= 1.5) return `偏快 · 约 ${percentText}`;
      return `过于激进 · 约 ${percentText}`;
    }

    function formatSignedValue(value) {
      const rounded = roundValue(value);
      return value > 0 ? `+${rounded}` : rounded;
    }


    function statCard(name, value, unit, note = "", variant = "") {
      const isEmpty = value === "未填" || value === "--" || value === "";
      const previous = previousStatValues.get(name);
      const changed = previous !== undefined && previous !== String(value);
      previousStatValues.set(name, String(value));
      const classes = ["stat"];
      if (variant) classes.push(variant);
      return `
        <div class="${classes.join(" ")}">
          <div class="stat-name">${name}</div>
          <div class="stat-value${isEmpty ? " is-empty" : ""}${changed ? " number-pop" : ""}">${value}</div>
          <div class="stat-unit">${unit}</div>
          ${note ? `<div class="stat-note">${note}</div>` : ""}
        </div>
      `;
    }

    function statsGroupLabel(text) {
      return `<div class="stats-group-label">${text}</div>`;
    }


    // 趋势工作区：单一主图表 + 指标/范围/视图控件，只重绘图表区域。
    function chartMetricMeta() {
      if (chartMetric === "weight") return { label: "体重", color: "var(--green)", key: "weight", unit: "kg" };
      if (chartMetric === "protein") return { label: "蛋白质", color: "var(--orange)", key: "protein", unit: "g" };
      return { label: "摄入", color: "var(--blue)", key: "intake", unit: "kcal" };
    }

    function rangeLabelFor(count) {
      return chartRange ? `近 ${chartRange} 天 · ${count} 个点` : `全部 ${count} 天`;
    }

    function chartControlsHtml() {
      const metrics = [["intake", "摄入"], ["weight", "体重"], ["protein", "蛋白质"]];
      const metricButtons = metrics.map(([value, label]) =>
        `<button class="range-btn${chartMetric === value ? " active" : ""}" type="button" data-metric="${value}" aria-pressed="${chartMetric === value}">${label}</button>`
      ).join("");
      const viewButtons = chartMetric === "intake" ? `
          <div class="chart-range-btns" role="group" aria-label="图表视图">
            <button class="range-btn${chartView === "line" ? " active" : ""}" type="button" data-view="line" aria-pressed="${chartView === "line"}">折线</button>
            <button class="range-btn${chartView === "bar" ? " active" : ""}" type="button" data-view="bar" aria-pressed="${chartView === "bar"}">周均</button>
          </div>` : "";
      const rangeButtons = [7, 30, 0].map((range) =>
        `<button class="range-btn${chartRange === range ? " active" : ""}" type="button" data-range="${range}" aria-pressed="${chartRange === range}">${range === 0 ? "全部" : `${range}天`}</button>`
      ).join("");
      return `
          <div class="chart-range-btns" role="group" aria-label="趋势指标">${metricButtons}</div>
${viewButtons}
          <div class="chart-range-btns" role="group" aria-label="时间范围">${rangeButtons}</div>
      `;
    }

    function renderCharts() {
      const sorted = getSortedRecords();
      if (!sorted.length) {
        charts.innerHTML = `
          <div class="chart-card">
            <div class="chart-head">
              <h3 class="chart-title"><span class="dot" style="background:var(--blue)"></span>趋势</h3>
              ${chartControlsHtml()}
            </div>
            <div class="empty-state">还没有记录。先保存今天的摄入，趋势会立刻出现。</div>
          </div>
        `;
        return;
      }

      const ranged = chartRange ? recordsInLastCalendarDays(sorted, chartRange) : sorted;
      const meta = chartMetricMeta();
      let body = "";
      if (chartMetric === "intake") {
        const intakeValues = ranged.map((record, index) => ({ index, date: record.date, value: record.intake }));
        const allIntakeValues = sorted.map((record, index) => ({ index, date: record.date, value: record.intake }));
        const targetIntake = dailyTargets.intake && Number(dailyTargets.intake) > 0 ? Number(dailyTargets.intake) : null;
        body = makeIntakeOverview(ranged, intakeValues, targetIntake, allIntakeValues);
      } else {
        const color = chartMetric === "weight" ? "#34c759" : "#ff9500";
        const values = ranged
          .map((record, index) => ({ index, date: record.date, value: record[meta.key] }))
          .filter((point) => point.value !== "" && Number.isFinite(Number(point.value)));
        body = values.length
          ? `<div class="chart-frame">${makeCompactChart(ranged, values, [], color, color, meta.unit)}</div>`
          : "";
      }
      if (!body) body = `<div class="empty-state">该范围暂无记录</div>`;

      charts.innerHTML = `
        <div class="chart-card">
          <div class="chart-head">
            <h3 class="chart-title"><span class="dot" style="background:${meta.color}"></span>${meta.label}趋势</h3>
            ${chartControlsHtml()}
            <span class="chart-note">${rangeLabelFor(ranged.length)}</span>
          </div>
          ${body}
        </div>
      `;
    }

    function animateChartsSwap() {
      if (prefersReducedMotion() || typeof charts.animate !== "function") return;
      charts.animate(
        [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }],
        { duration: 180, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
      );
    }

    function makeIntakeOverview(records, values, targetIntake, allValues = values) {
      if (!values.length) {
        return `<div class="empty-state">该范围暂无记录</div>`;
      }
      const averageValues = movingAverage(values, allValues, 7);
      const latest = values[values.length - 1].value;
      const average = Math.round(values.reduce((sum, point) => sum + point.value, 0) / values.length);
      const highest = values.reduce((max, point) => point.value > max.value ? point : max, values[0]);
      const lowest = values.reduce((min, point) => point.value < min.value ? point : min, values[0]);

      const chartContent = chartView === "bar"
        ? makeWeeklyBarChart(records, targetIntake)
        : makeCompactChart(records, values, averageValues, "#8ec5ff", "#0057d9", "kcal", targetIntake);

      const legendContent = chartView === "bar"
        ? (targetIntake ? `<span class="legend-item"><span class="legend-line" style="height:2px;background:var(--red);border-style:dashed"></span>目标 ${targetIntake} kcal</span>` : "")
        : `<span class="legend-item"><span class="legend-line" style="background:#8ec5ff"></span>每天</span>
            <span class="legend-item"><span class="legend-line" style="height:5px;background:#0057d9"></span>7天平均</span>
            ${targetIntake ? `<span class="legend-item"><span class="legend-line" style="height:2px;background:var(--red);border-style:dashed"></span>目标 ${targetIntake} kcal</span>` : ""}`;

      return `
          <div class="trend-summary">
            <div class="trend-chip"><span>最近一天</span><strong>${latest} kcal</strong></div>
            <div class="trend-chip"><span>平均摄入</span><strong>${average} kcal</strong></div>
            <div class="trend-chip"><span>范围</span><strong>${lowest.value}-${highest.value}</strong></div>
          </div>
          <div class="legend">${legendContent}</div>
          <div class="chart-frame">${chartContent}</div>
      `;
    }
