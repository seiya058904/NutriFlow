<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a84ff">
  <title>每日饮食记录</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: rgba(255, 255, 255, 0.78);
      --text: #1d1d1f;
      --muted: #69707d;
      --soft: #8a94a6;
      --line: rgba(88, 96, 115, 0.16);
      --blue: #0a84ff;
      --blue-deep: #0066d6;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --violet: #5e5ce6;
      --glass: rgba(255, 255, 255, 0.72);
      --shadow: 0 24px 70px rgba(30, 41, 59, 0.12);
      --shadow-soft: 0 10px 28px rgba(30, 41, 59, 0.08);
      --radius: 24px;
      --chart-bg: #fbfbfd;
      --input-bg: rgba(255, 255, 255, 0.86);
      --input-focus-bg: #fff;
      --progress-card-bg: rgba(255, 255, 255, 0.74);
      --progress-track-bg: #e7ebf2;
      --marker-ring: rgba(255, 255, 255, 0.9);
      --btn-secondary-bg: rgba(236, 239, 245, 0.94);
      --toast-bg: rgba(255, 255, 255, 0.96);
      --ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-1: 160ms;
      --dur-2: 280ms;
      --dur-3: 460ms;
      --section-gap: 18px;
    }

    [data-theme="dark"] {
      --bg: #1c1c1e;
      --panel: rgba(44, 44, 46, 0.82);
      --text: #f5f5f7;
      --muted: #98989d;
      --soft: #636366;
      --line: rgba(255, 255, 255, 0.12);
      --blue: #0a84ff;
      --blue-deep: #409cff;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
      --shadow-soft: 0 10px 28px rgba(0, 0, 0, 0.3);
      --chart-bg: #2c2c2e;
      --input-bg: rgba(58, 58, 60, 0.86);
      --input-focus-bg: #3a3a3c;
      --progress-card-bg: rgba(58, 58, 60, 0.86);
      --progress-track-bg: rgba(255, 255, 255, 0.14);
      --marker-ring: rgba(28, 28, 30, 0.9);
      --btn-secondary-bg: rgba(58, 58, 60, 0.94);
      --toast-bg: rgba(44, 44, 46, 0.96);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg);
      background-image: linear-gradient(180deg, #fbfcff 0%, var(--bg) 520px);
      background-repeat: no-repeat;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    [data-theme="dark"] body {
      background-color: var(--bg);
      background-image: linear-gradient(180deg, #1c1c1e 0%, var(--bg) 520px);
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100vh;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.42) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.42) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent 58%);
      pointer-events: none;
    }

    [data-theme="dark"] body::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
    }

    button,
    input,
    textarea {
      font: inherit;
      min-width: 0;
    }

    .app {
      width: min(100% - 48px, 1400px);
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .storage-warning {
      margin: 0 0 16px;
      padding: 12px 16px;
      border: 1px solid var(--red);
      border-radius: 16px;
      color: var(--red);
      background: var(--btn-secondary-bg);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 400px);
      align-items: stretch;
      gap: 18px;
      margin-bottom: var(--section-gap);
      padding: 14px 22px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px);
      min-width: 0;
    }

    .hero-copy {
      display: grid;
      align-content: center;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 68px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .subtitle-en {
      margin: 6px 0 0;
      color: var(--blue);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .today-pill {
      width: fit-content;
      margin-top: 12px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: var(--btn-secondary-bg);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .today-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
      min-width: 0;
    }

    .summary-card {
      min-height: 72px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .summary-card.wide {
      grid-column: 1 / -1;
      min-height: auto;
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .summary-value {
      display: block;
      margin-top: 4px;
      font-size: 24px;
      line-height: 1.08;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .summary-note {
      display: block;
      margin-top: 4px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(300px, 320px) minmax(0, 1fr);
      gap: var(--section-gap);
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      overflow: hidden;
      min-width: 0;
    }

    .panel-inner {
      padding: 22px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 780;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.2;
      font-weight: 720;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input {
      height: 48px;
      padding: 0 14px;
    }

    textarea {
      min-height: 136px;
      resize: vertical;
      padding: 14px;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      background: var(--input-focus-bg);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.13);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 46px;
      border: 0;
      border-radius: 15px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 760;
      color: #fff;
      background: linear-gradient(180deg, #2f9bff, var(--blue-deep));
      box-shadow: 0 12px 22px rgba(10, 132, 255, 0.24);
      transition: transform 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 15px 28px rgba(10, 132, 255, 0.27);
    }

    .btn:active {
      transform: translateY(0);
      opacity: 0.82;
    }

    .btn.secondary {
      color: var(--text);
      background: var(--btn-secondary-bg);
      box-shadow: inset 0 0 0 1px rgba(88, 96, 115, 0.06);
    }

    .message {
      min-height: 22px;
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      color: var(--red);
    }

    .message.success {
      color: #1f8a3b;
    }

    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--toast-bg);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.14);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      max-width: 340px;
      opacity: 0;
      transform: translateX(20px);
      animation: toastIn 0.25s ease forwards;
    }

    .toast.toast-out {
      animation: toastOut 0.2s ease forwards;
    }

    .toast.error {
      border-left: 4px solid var(--red);
    }

    .toast.success {
      border-left: 4px solid var(--green);
    }

    @keyframes toastIn {
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      to { opacity: 0; transform: translateX(20px); }
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: var(--btn-secondary-bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1;
      box-shadow: var(--shadow-soft);
      transition: transform 0.16s ease, background 0.3s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    .target-settings {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .target-settings h3 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 760;
    }

    .target-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .target-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.good {
      background: #34c759;
    }

    .legend-dot.warn {
      background: #ff9500;
    }

    .legend-dot.low {
      background: #ff3b30;
    }

    .legend-dot.none {
      background: #c7c7cc;
    }

    .target-progress {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .target-progress-card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--progress-card-bg);
    }

    .target-progress-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .target-progress-card strong {
      display: block;
      margin-top: 6px;
      font-size: 22px;
      line-height: 1.1;
    }

    .target-progress-track {
      height: 8px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--progress-track-bg);
    }

    .target-progress-fill {
      height: 100%;
      border-radius: inherit;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .utility-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.9fr);
      gap: var(--section-gap);
      margin-top: var(--section-gap);
      align-items: stretch;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .stat {
      min-height: 120px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow-soft);
    }

    .stat-name {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 10px;
      font-size: clamp(24px, 2.4vw, 30px);
      line-height: 1.1;
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .stat-unit {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .stat-note {
      display: inline-flex;
      width: fit-content;
      margin-top: 10px;
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--btn-secondary-bg);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .stats-group-label {
      grid-column: 1 / -1;
      margin-top: 4px;
      color: var(--soft);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.08em;
    }

    .stat.stat-accent {
      border-color: rgba(10, 132, 255, 0.38);
      background: linear-gradient(180deg, rgba(10, 132, 255, 0.13), rgba(10, 132, 255, 0.05));
    }

    .stat.stat-accent .stat-value {
      color: var(--blue-deep);
    }

    .stat.stat-compact {
      min-height: 0;
      padding: 14px 16px;
      box-shadow: none;
    }

    .stat.stat-wide {
      grid-column: span 2;
    }

    .stat.stat-compact .stat-value {
      margin-top: 6px;
      font-size: 20px;
    }

    .stat.stat-compact .stat-note {
      margin-top: 8px;
    }

    .stat-value.is-empty {
      color: var(--soft);
      font-size: 19px;
      font-weight: 700;
    }

    .utility-group-label {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--soft);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.08em;
    }

    .utility-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn.quiet {
      min-height: 36px;
      padding: 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .btn.quiet:hover {
      transform: none;
      color: var(--text);
      background: var(--btn-secondary-bg);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .utility-hint {
      color: var(--soft);
      font-size: 12px;
      line-height: 1.5;
    }

    .charts {
      display: grid;
      gap: 16px;
    }

    .chart-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      overflow: hidden;
    }

    .chart-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 0;
    }

    .chart-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 15px;
      font-weight: 760;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .chart-note {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .chart-range-btns {
      display: flex;
      gap: 4px;
    }

    .range-btn {
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 6px 14px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .range-btn:hover {
      background: var(--btn-secondary-bg);
    }

    .range-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .trend-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 16px 0;
    }

    .trend-chip {
      padding: 12px;
      border-radius: 16px;
      background: var(--btn-secondary-bg);
    }

    .trend-chip span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .trend-chip strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      padding: 10px 16px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-line {
      width: 22px;
      height: 3px;
      border-radius: 999px;
      display: inline-block;
      background: var(--blue);
    }

    .chart-frame {
      padding: 8px 14px 16px;
    }

    .chart-frame svg {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    .hover-point {
      outline: none;
    }

    .chart-hover-region {
      fill: transparent;
      cursor: crosshair;
    }

    .chart-focus-line,
    .chart-focus-dot,
    .point-tooltip {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }

    .hover-point:hover .chart-focus-line,
    .hover-point:hover .chart-focus-dot,
    .hover-point:hover .point-tooltip,
    .hover-point:focus .chart-focus-line,
    .hover-point:focus .chart-focus-dot,
    .hover-point:focus .point-tooltip {
      opacity: 1;
    }

    .point-tooltip rect {
      fill: var(--text);
      stroke: var(--line);
    }

    .point-tooltip text {
      fill: var(--bg);
      font-size: 11px;
    }

    .point-tooltip .tooltip-value {
      font-size: 13px;
      font-weight: 760;
    }

    .calendar-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .month-title {
      font-size: 20px;
      font-weight: 760;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: var(--btn-secondary-bg);
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .icon-btn:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px 10px;
    }

    .weekday {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 0;
    }

    .day {
      position: relative;
      min-height: 44px;
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }

    .day:hover {
      background: rgba(255, 255, 255, 0.72);
      transform: translateY(-1px);
    }

    [data-theme="dark"] .day:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .day.empty {
      cursor: default;
    }

    .day.empty:hover {
      background: transparent;
    }

    .day.has-record {
      background: rgba(232, 244, 255, 0.94);
      border-color: rgba(10, 132, 255, 0.24);
      color: #005fc7;
    }

    [data-theme="dark"] .day.has-record {
      background: rgba(10, 132, 255, 0.18);
      border-color: rgba(10, 132, 255, 0.42);
      color: #6cb5ff;
    }

    .day-target-dots {
      position: absolute;
      left: 50%;
      bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .target-marker {
      width: 7px;
      height: 7px;
      background: #d1d1d6;
      box-shadow: 0 0 0 2px var(--marker-ring);
    }

    .target-marker.metric-intake {
      border-radius: 50%;
    }

    .target-marker.metric-protein {
      border-radius: 2px;
      transform: rotate(45deg);
    }

    .target-marker.metric-weight {
      border-radius: 2px;
      width: 5px;
      height: 9px;
    }

    .target-status-good,
    .target-progress-fill.target-status-good {
      background: #34c759;
    }

    .target-status-warn,
    .target-progress-fill.target-status-warn {
      background: #ff9500;
    }

    .target-status-low,
    .target-progress-fill.target-status-low {
      background: #ff3b30;
    }

    .target-status-none,
    .target-progress-fill.target-status-none {
      background: #c7c7cc;
    }

    .day.selected {
      background: linear-gradient(180deg, #2f9bff, var(--blue-deep));
      color: #fff;
      box-shadow: 0 12px 22px rgba(10, 132, 255, 0.24);
    }

    .day.selected .target-marker {
      box-shadow: 0 0 0 2px var(--blue);
    }

    .day.today:not(.selected)::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue);
      transform: translateX(-50%);
    }

    .review {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .review-date {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 760;
    }

    .review-values {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
    }

    .mini {
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--btn-secondary-bg);
    }

    .mini span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .mini strong {
      display: block;
      margin-top: 6px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .import-help {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .import-preview {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .import-preview.show {
      display: grid;
      gap: 10px;
    }

    .import-preview-title {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .import-preview-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
      padding-right: 4px;
    }

    .import-preview-row {
      display: grid;
      grid-template-columns: minmax(96px, 1.2fr) repeat(4, minmax(76px, 1fr)) auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 14px;
      background: var(--btn-secondary-bg);
      font-size: 13px;
    }

    .import-preview-row strong {
      display: block;
      color: var(--text);
      font-size: 15px;
    }

    .import-preview-badge {
      justify-self: end;
      padding: 5px 8px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--btn-secondary-bg);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .records {
      display: grid;
      align-content: start;
      gap: 10px;
      max-height: 420px;
      overflow: auto;
      scroll-snap-type: y proximity;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .records::-webkit-scrollbar {
      width: 6px;
    }

    .records::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 999px;
    }

    .record {
      display: grid;
      grid-template-columns: 132px repeat(4, minmax(0, 1fr)) auto;
      align-items: center;
      gap: 12px 18px;
      padding: 14px 16px;
      scroll-snap-align: start;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow-soft);
    }

    .record-date {
      font-size: 15px;
      font-weight: 760;
    }

    .record-value {
      color: var(--muted);
      font-size: 14px;
    }

    .record-value strong {
      display: block;
      color: var(--text);
      font-size: 16px;
    }

    .link-btn {
      border: 0;
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
      color: var(--blue);
      background: var(--btn-secondary-bg);
      font-weight: 700;
      transition: background 0.16s ease, transform 0.16s ease;
    }

    .link-btn:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .delete-btn {
      color: var(--red);
    }

    .delete-btn:hover {
      background: rgba(255, 69, 58, 0.1);
    }

    .record-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-self: end;
    }

    .empty-state {
      padding: 28px 18px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      background: var(--input-bg);
      line-height: 1.6;
    }

    @keyframes savePulse {
      0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(48, 209, 88, 0); }
      100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
    }

    .save-pulse {
      animation: savePulse 0.5s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .calendar-slide {
      animation: slideIn 0.2s ease;
    }

    @keyframes numberPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .number-pop {
      animation: numberPop 0.3s ease;
    }

    .diet-pet {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      display: grid;
      justify-items: end;
      gap: 10px;
      pointer-events: none;
    }

    .pet-speech {
      width: min(260px, calc(100vw - 44px));
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--toast-bg);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.14);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .pet-speech.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pet-button {
      position: relative;
      width: 96px;
      height: 96px;
      padding: 0;
      border: 0;
      border-radius: 28px;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.16s ease;
    }

    .pet-button:hover,
    .pet-button:focus-visible,
    .pet-button.is-talking {
      transform: translateY(-3px);
      outline: none;
    }

    .pet-art {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.18));
    }

    .pet-button.is-talking .pet-art {
      animation: petBounce 0.42s ease;
    }

    .fox-outline {
      stroke: #3f0a7b;
      stroke-width: 4.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-theme="dark"] .fox-outline {
      stroke: #c9a0ff;
    }

    [data-theme="dark"] .fox-purple {
      fill: #c9a0ff;
    }

    .fox-orange {
      fill: #ff9f2d;
    }

    .fox-white {
      fill: #fffafd;
    }

    .fox-pink {
      fill: #ff6f8e;
    }

    .fox-heart {
      fill: #f72576;
    }

    .fox-heart-shadow {
      fill: #c91867;
      opacity: 0.72;
    }

    .fox-purple {
      fill: #3f0a7b;
    }

    .fox-pad {
      fill: #ff706d;
    }

    .fox-shadow {
      fill: rgba(29, 29, 31, 0.22);
    }

    [data-theme="dark"] .fox-shadow {
      fill: rgba(0, 0, 0, 0.5);
    }

    @keyframes petBounce {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.08) rotate(-2deg);
      }

      100% {
        transform: scale(1);
      }
    }

    .pet-ear,
    .pet-foot,
    .pet-eye,
    .pet-mouth,
    .pet-cheek {
      position: absolute;
      display: block;
    }

    .pet-ear {
      top: 6px;
      width: 14px;
      height: 17px;
      border-radius: 50% 50% 45% 45%;
      background: #48c995;
    }

    .pet-ear.left {
      left: 14px;
      transform: rotate(-28deg);
    }

    .pet-ear.right {
      right: 14px;
      transform: rotate(28deg);
    }

    .pet-face {
      position: absolute;
      inset: 13px 11px 10px;
      border-radius: 48% 48% 44% 44%;
      background: #f8fff8;
    }

    .pet-eye {
      top: 28px;
      width: 6px;
      height: 7px;
      border-radius: 50%;
      background: #1d1d1f;
    }

    .pet-eye.left {
      left: 22px;
    }

    .pet-eye.right {
      right: 22px;
    }

    .pet-cheek {
      top: 36px;
      width: 7px;
      height: 5px;
      border-radius: 999px;
      background: #ffb7a8;
      opacity: 0.75;
    }

    .pet-cheek.left {
      left: 15px;
    }

    .pet-cheek.right {
      right: 15px;
    }

    .pet-mouth {
      left: 50%;
      top: 37px;
      width: 11px;
      height: 6px;
      border-bottom: 2px solid #1d1d1f;
      border-radius: 0 0 999px 999px;
      transform: translateX(-50%);
    }

    .pet-foot {
      bottom: 5px;
      width: 12px;
      height: 7px;
      border-radius: 999px;
      background: #ffcc66;
    }

    .pet-foot.left {
      left: 17px;
    }

    .pet-foot.right {
      right: 17px;
    }

    @media (max-width: 880px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .utility-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 620px) {
      .app {
        padding-top: 14px;
      }

      .topbar {
        padding: 58px 18px 18px;
        border-radius: 24px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 14px;
        max-width: 22em;
      }

      .subtitle-en {
        font-size: 15px;
      }

      .today-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-card {
        min-height: auto;
      }

      .summary-card.wide {
        grid-column: 1 / -1;
        min-height: auto;
      }

      .panel-inner {
        padding: 16px;
      }

      .field-row,
      .trend-summary,
      .review-values {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }

      .calendar {
        gap: 6px;
      }

      .day {
        border-radius: 12px;
        font-size: 13px;
        min-height: 44px;
      }

      .link-btn {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .import-preview-row {
        grid-template-columns: 1fr;
      }

      .import-preview-badge {
        justify-self: start;
      }

      .target-progress {
        grid-template-columns: 1fr;
      }

      .diet-pet {
        right: 8px;
        bottom: 8px;
      }

      .pet-button {
        width: 62px;
        height: 62px;
      }

      .pet-speech {
        width: min(230px, calc(100vw - 24px));
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {
      .app {
        width: calc(100% - 36px);
      }

      .panel-inner,
      .topbar {
        padding: 15px;
      }
    }

    /* —— 本轮增补：微交互、可达性与排版统一 —— */
    .calendar-nav {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .today-jump {
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: var(--btn-secondary-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .today-jump:hover {
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px var(--line), var(--shadow-soft);
    }

    .water-block {
      min-width: 0;
    }

    .quick-fill {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chip-step {
      height: 34px;
      padding: 0 13px;
      border: 0;
      border-radius: 12px;
      background: var(--btn-secondary-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .chip-step:hover {
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px var(--line), var(--shadow-soft);
    }

    .chip-step:active {
      transform: translateY(0);
    }

    .stat,
    .summary-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .stat:hover,
    .summary-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }

    .record {
      transition: background 0.16s ease;
    }

    .record:hover {
      background: rgba(255, 255, 255, 0.55);
    }

    [data-theme="dark"] .record:hover {
      background: rgba(58, 58, 60, 0.55);
    }

    .day.selected {
      box-shadow: 0 6px 16px rgba(10, 132, 255, 0.25);
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .summary-value,
    .stat-value,
    .stat-unit,
    .trend-chip strong,
    .tooltip-value,
    .record-value strong,
    .review-values strong {
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* —— 第三轮：全站动效系统与主题质感（借鉴 Stripe 氛围渐变 / Linear 暗色发丝线 / Apple 字距）—— */

    /* Aurora 漂移光斑层（Stripe 式氛围渐变，纯 transform 动画保证性能） */
    body::after {
      content: "";
      position: absolute;
      top: -160px;
      left: -160px;
      right: -160px;
      height: 1750px;
      z-index: -1;
      background:
        radial-gradient(46% 36% at 14% 4%, rgba(10, 132, 255, 0.14), transparent 72%),
        radial-gradient(40% 30% at 88% 0%, rgba(48, 209, 88, 0.10), transparent 72%),
        radial-gradient(42% 38% at 78% 34%, rgba(94, 92, 230, 0.12), transparent 72%),
        radial-gradient(30% 26% at 8% 46%, rgba(255, 159, 10, 0.06), transparent 72%);
      animation: auroraDrift 22s var(--ease-out-soft) infinite alternate;
      pointer-events: none;
    }

    [data-theme="dark"] body::after {
      background:
        radial-gradient(46% 36% at 14% 4%, rgba(10, 132, 255, 0.08), transparent 72%),
        radial-gradient(40% 30% at 88% 0%, rgba(48, 209, 88, 0.05), transparent 72%),
        radial-gradient(42% 38% at 78% 34%, rgba(94, 92, 230, 0.10), transparent 72%),
        radial-gradient(30% 26% at 8% 46%, rgba(255, 159, 10, 0.04), transparent 72%);
    }

    @keyframes auroraDrift {
      from { transform: translate3d(-1.5%, -1%, 0) rotate(-1.2deg); }
      to { transform: translate3d(2%, 1.5%, 0) rotate(1.2deg); }
    }

    /* 页面载入编排：顶栏与面板依序浮现 */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .topbar {
      animation: riseIn var(--dur-3) var(--ease-out-soft) both;
    }

    .grid .stack .panel {
      animation: riseIn var(--dur-3) var(--ease-out-soft) both;
    }

    .grid .stack:nth-child(1) .panel:nth-child(1) { animation-delay: 90ms; }
    .grid .stack:nth-child(1) .panel:nth-child(2) { animation-delay: 170ms; }
    .grid .stack:nth-child(1) .panel:nth-child(3) { animation-delay: 250ms; }
    .grid .stack:nth-child(2) .panel:nth-child(1) { animation-delay: 150ms; }

    .grid > .records-section {
      animation: riseIn var(--dur-3) var(--ease-out-soft) both;
      animation-delay: 230ms;
    }

    /* 数据更新弹跳：统计卡数值在重渲染时轻跳一下 */
    .stat-value {
      animation: numberPop 0.32s var(--ease-spring) both;
      transform-origin: left center;
    }

    /* 主按钮光泽扫过（Stripe 式微交互） */
    .btn {
      position: relative;
      overflow: hidden;
    }

    .btn:not(.secondary)::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.42) 50%, transparent 68%);
      transform: translateX(-130%);
      transition: transform 0.7s var(--ease-out-soft);
      pointer-events: none;
    }

    .btn:not(.secondary):hover::after {
      transform: translateX(130%);
    }

    /* Linear 式暗色深度：发丝线边框 + 表面阶梯替代重阴影 */
    [data-theme="dark"] .panel,
    [data-theme="dark"] .summary-card {
      border-color: rgba(255, 255, 255, 0.085);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
    }

    [data-theme="dark"] .stat:hover,
    [data-theme="dark"] .summary-card:hover {
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
    }

    [data-theme="dark"] .chip-step:hover,
    [data-theme="dark"] .today-jump:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* 目标进度条生长动效 */
    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .target-progress-fill {
      animation: growBar 0.5s var(--ease-out-soft) both;
      transform-origin: left center;
    }

    /* 大标题渐变文字（支持探测，渐进增强） */
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      h1 {
        background: linear-gradient(100deg, var(--blue-deep) 8%, var(--violet) 55%, var(--blue) 92%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      [data-theme="dark"] h1 {
        background: linear-gradient(100deg, #409cff 8%, #a48bff 55%, #2997ff 92%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }

    /* 字距精修（Apple 式负字距，仅小标题层级） */
    .panel h2,
    .month-title,
    .chart-title {
      letter-spacing: -0.2px;
    }

    /* 统一缓动曲线覆盖 */
    .btn,
    .icon-btn,
    .today-jump,
    .chip-step,
    .day,
    .record,
    .stat,
    .summary-card,
    .theme-toggle {
      transition-timing-function: var(--ease-out-soft);
    }

    .toast {
      animation: toastIn 0.3s var(--ease-spring) forwards;
    }

    .toast.toast-out {
      animation: toastOut 0.22s var(--ease-out-soft) forwards;
    }

    .pet-speech {
      transition: opacity 0.22s var(--ease-out-soft), transform 0.22s var(--ease-spring);
    }

    /* 宠物待机漂浮（作用于内层 SVG，不干扰按钮 hover 位移与说话弹跳） */
    .pet-art {
      animation: petFloat 4s ease-in-out infinite;
    }

    @keyframes petFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .pet-button.is-talking .pet-art {
      animation: petBounce 0.42s var(--ease-spring);
    }

    .range-btn:active {
      transform: scale(0.96);
    }

    /* —— 第四轮：布局收敛（Desktop 双栏网格 / 中屏压缩 / 移动单栏重排）—— */
    @media (min-width: 768px) and (max-width: 1199px) {
      .grid {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 1199px) {
      .record {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-areas:
          "date date date actions"
          "v1 v2 v3 v4";
        row-gap: 8px;
      }

      .record-date {
        grid-area: date;
      }

      .record > .record-value:nth-child(2) { grid-area: v1; }
      .record > .record-value:nth-child(3) { grid-area: v2; }
      .record > .record-value:nth-child(4) { grid-area: v3; }
      .record > .record-value:nth-child(5) { grid-area: v4; }
      .record-actions {
        grid-area: actions;
        align-self: center;
      }

      .chart-card .empty-state {
        padding: 22px 16px;
      }
    }

    @media (max-width: 767px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 390px) {
      .record {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "date actions"
          "v1 v2"
          "v3 v4";
      }
    }

    .utility-grid .panel {
      animation: riseIn var(--dur-3) var(--ease-out-soft) both;
    }

    .utility-grid .panel:nth-child(1) { animation-delay: 260ms; }
    .utility-grid .panel:nth-child(2) { animation-delay: 330ms; }

    /* —— 桌面端：全部记录横跨两列，填掉左栏下方的页面级空洞 —— */
    @media (min-width: 768px) {
      .grid > .records-section {
        grid-column: 1 / -1;
      }
    }

    .utility-grid .panel-inner {
      padding-top: 18px;

    }

    .utility-grid > .panel:first-child {
      display: flex;

    }

    .utility-grid > .panel:first-child .panel-inner {
      flex: 1;
      min-height: 0;
      display: flex;

    }

    .utility-grid > .panel:first-child textarea {

    .review .empty-state {

    label.btn {

      justify-content: center;
      font-size: inherit;

      </div>
    </header>

    <section class="grid">
      <div class="stack">
        <section class="panel">
          <div class="panel-inner">
            <h2 id="formTitle">填写今天</h2>

              <label>

                <input id="dateInput" type="date" required>
              </label>
              <label>

                <input id="intakeInput" type="number" min="0" step="1" placeholder="例如 2100" required>
              </label>
              <div class="field-row">
                <label>
                  体重 kg（可不填）
                  <input id="weightInput" type="number" min="0" step="0.1" placeholder="例如 68.5">
                </label>
                <label>
                  蛋白质 g（可不填）
                  <input id="proteinInput" type="number" min="0" step="0.1" placeholder="例如 120">
                </label>
              </div>
