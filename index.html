    const recordsBox = document.querySelector("#records");
    const todayText = document.querySelector("#todayText");
    const todaySummary = document.querySelector("#todaySummary");
    const petButton = document.querySelector("#petButton");
    const petSpeech = document.querySelector("#petSpeech");
    const waterInput = document.querySelector("#waterInput");
    const targetIntakeInput = document.querySelector("#targetIntakeInput");
    const targetProteinInput = document.querySelector("#targetProteinInput");
    const heightInput = document.querySelector("#heightInput");
    const targetWaterInput = document.querySelector("#targetWaterInput");
    const targetMessage = document.querySelector("#targetMessage");
    const saveTargetsBtn = document.querySelector("#saveTargetsBtn");
    const targetProgress = document.querySelector("#targetProgress");

    let today = toDateString(new Date());
    let selectedDate = today;
    let calendarYear = Number(today.slice(0, 4));
    let calendarMonth = Number(today.slice(5, 7)) - 1;
    let pendingImportRecords = [];
    let corruptRecordsRaw = "";
    let corruptRecordsStatus = "";
    let storageUnavailable = false;
    let restoreRecoveryPending = false;
    let lastPetLineIndex = -1;
    let petSpeechTimer = null;
    let dailyTargets = { intake: "", protein: "", height: "", water: "" };
    let chartRange = 30;
    let chartView = "line";

    function toDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDateText(dateString) {
      const [year, month, day] = dateString.split("-");
      return `${year}年${Number(month)}月${Number(day)}日`;
    }

    function readNumber(value, required) {
      const trimmed = String(value ?? "").trim();
      if (!trimmed) return required ? null : "";
      const number = Number(trimmed);
      if (!Number.isFinite(number) || number < 0) return null;
      return number;
    }

    function normalizeRecord(record) {
      if (!record || !isValidDate(record.date)) return null;
      const intake = readNumber(record.intake, true);
      const weight = readNumber(record.weight ?? "", false);
      const protein = readNumber(record.protein ?? "", false);
      const water = readNumber(record.water ?? "", false);
      if (intake === null || weight === null || protein === null || water === null) return null;
      return { date: record.date, intake, weight, protein, water };
    }

    function normalizeTargetsObject(raw) {
      const source = raw && typeof raw === "object" ? raw : {};
      const readTarget = (value) => Number.isFinite(Number(value)) && Number(value) > 0 ? Number(value) : "";
      return {
        intake: readTarget(source.intake),
        protein: readTarget(source.protein),
        height: readTarget(source.height),
        water: readTarget(source.water)
      };
    }

    function syncTargetInputs() {
      targetIntakeInput.value = dailyTargets.intake === "" ? "" : dailyTargets.intake;
      targetProteinInput.value = dailyTargets.protein === "" ? "" : dailyTargets.protein;
      heightInput.value = dailyTargets.height === "" ? "" : dailyTargets.height;
      targetWaterInput.value = dailyTargets.water === "" ? "" : dailyTargets.water;
    }

    function writeTargets(targets) {
      return storageSet(TARGET_STORAGE_KEY, JSON.stringify(targets)) === true;
    }

    function writeStorageDirect(key, value) {
      try {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
        return true;
      } catch (error) {
        return false;
      }
    }

    function restoreFullBackup(backup) {
      if (!backup || !Array.isArray(backup.records)) return false;
      if (backup.schemaVersion !== undefined && backup.schemaVersion !== 1) return false;
      const recordsSnapshot = new Map(recordsByDate);
      const targetsSnapshot = { ...dailyTargets };
      const themeSnapshot = document.documentElement.getAttribute("data-theme") || "light";
      const corruptRawSnapshot = corruptRecordsRaw;
      const corruptStatusSnapshot = corruptRecordsStatus;
      const oldRecords = storageGet(STORAGE_KEY);
      const oldTargets = storageGet(TARGET_STORAGE_KEY);
      const oldTheme = storageGet(THEME_KEY);

      const journal = {
        schemaVersion: 1,
        savedAt: new Date().toISOString(),
        records: oldRecords,
        targets: oldTargets,
        theme: oldTheme
      };
      if (storageSet(RESTORE_JOURNAL_KEY, JSON.stringify(journal)) !== true) return false;

      recordsByDate.clear();
      backup.records.forEach((record) => recordsByDate.set(record.date, record));
      dailyTargets = normalizeTargetsObject(backup.targets);
      const restoreTheme = backup.preferences && backup.preferences.theme === "dark" ? "dark" : "light";
      applyTheme(restoreTheme);
      syncTargetInputs();

      const recordsSaved = saveRecords();
      const targetsSaved = writeTargets(dailyTargets);
      const themeSaved = storageSet(THEME_KEY, restoreTheme) === true;
      if (recordsSaved && targetsSaved && themeSaved) {
        try { localStorage.removeItem(RESTORE_JOURNAL_KEY); } catch (error) {}
        return true;
      }

      recordsByDate.clear();
      recordsSnapshot.forEach((record, date) => recordsByDate.set(date, record));
      dailyTargets = targetsSnapshot;
      applyTheme(themeSnapshot);
      syncTargetInputs();
      corruptRecordsRaw = corruptRawSnapshot;
      corruptRecordsStatus = corruptStatusSnapshot;
      let rollbackOk = true;
      if (recordsSaved) rollbackOk = writeStorageDirect(STORAGE_KEY, oldRecords) && rollbackOk;
      if (targetsSaved) rollbackOk = writeStorageDirect(TARGET_STORAGE_KEY, oldTargets) && rollbackOk;
      if (themeSaved) rollbackOk = writeStorageDirect(THEME_KEY, oldTheme) && rollbackOk;
      if (rollbackOk) {
        try { localStorage.removeItem(RESTORE_JOURNAL_KEY); } catch (error) {}
      }
      return false;
    }

    function isValidRestoreJournal(journal) {
      if (!journal || typeof journal !== "object") return false;
      if (journal.schemaVersion !== 1) return false;
      if (!Object.prototype.hasOwnProperty.call(journal, "records")) return false;
      if (!Object.prototype.hasOwnProperty.call(journal, "targets")) return false;
      if (!Object.prototype.hasOwnProperty.call(journal, "theme")) return false;
      return [journal.records, journal.targets, journal.theme].every((value) => value === null || typeof value === "string");
    }

    function recoverRestoreJournal() {
      const raw = storageGet(RESTORE_JOURNAL_KEY);
      if (!raw) {
        restoreRecoveryPending = false;
        return true;
      }
      let journal;
      try {
        journal = JSON.parse(raw);
      } catch (error) {
        restoreRecoveryPending = true;
        return false;
      }
      if (!isValidRestoreJournal(journal)) {
        restoreRecoveryPending = true;
        return false;
      }
      const recordsOk = writeStorageDirect(STORAGE_KEY, journal.records);
      const targetsOk = writeStorageDirect(TARGET_STORAGE_KEY, journal.targets);
      const themeOk = writeStorageDirect(THEME_KEY, journal.theme);
      if (recordsOk && targetsOk && themeOk) {
        try { localStorage.removeItem(RESTORE_JOURNAL_KEY); } catch (error) {}
        restoreRecoveryPending = false;
        loadRecords();
        loadTargets();
        applyTheme(storageGet(THEME_KEY) === "dark" ? "dark" : "light");
        return true;
      }
      restoreRecoveryPending = true;
      return false;
    }

    function ensureRestoreRecovery() {
      if (!restoreRecoveryPending) return true;
      if (recoverRestoreJournal()) return true;
      showToast("存在未完成的恢复日志，已暂停新的保存操作。请勿清除站点数据，刷新后会自动重试恢复。", "error");
      renderStorageStatus();
      return false;
    }

    function setMessage(element, text, type) {
      element.textContent = text;
      element.className = `message ${type || ""}`;
      if (text && type) showToast(text, type);
    }

    function storageGet(key) {
      try { return localStorage.getItem(key); }
      catch (error) { storageUnavailable = true; return null; }
    }

    function storageSet(key, value) {
      if (restoreRecoveryPending && !ensureRestoreRecovery()) return false;
      if (storageUnavailable) return "memory";
      try { localStorage.setItem(key, value); return true; }
      catch (error) {
        if (error && error.name === "SecurityError") storageUnavailable = true;
        return storageUnavailable ? "memory" : false;
      }
    }

    function applyRecordMutationAndSave(mutate) {
      const snapshot = { records: new Map(recordsByDate), selectedDate, calendarYear, calendarMonth };
      mutate();
      const saved = saveRecords();
      if (saved) return saved;
      recordsByDate.clear();
      snapshot.records.forEach((record, date) => recordsByDate.set(date, record));
      selectedDate = snapshot.selectedDate;
      calendarYear = snapshot.calendarYear;
      calendarMonth = snapshot.calendarMonth;
      return false;
    }

    function showToast(text, type) {
      const container = document.querySelector("#toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type || ""}`;
      toast.setAttribute("role", type === "error" ? "alert" : "status");
      toast.textContent = text;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("toast-out");
        toast.addEventListener("animationend", () => toast.remove());
      }, 3000);
    }

    function clearImportPreview() {
      pendingImportRecords = [];
      importPreview.classList.remove("show");
      importPreview.innerHTML = "";
    }

    function loadRecords() {
      recordsByDate.clear();
      const saved = storageGet(STORAGE_KEY);
      if (!saved) return;

      try {
        const records = JSON.parse(saved);
        if (!Array.isArray(records)) {
          corruptRecordsRaw = saved;
          corruptRecordsStatus = "全部无法读取";
          return;
        }
        const dates = new Set();
        let hasRejectedRecord = false;
        records.forEach((record) => {
          const normalized = normalizeRecord(record);
          if (!normalized || dates.has(normalized.date)) {
            hasRejectedRecord = true;
            return;
          }
          dates.add(normalized.date);
          recordsByDate.set(normalized.date, normalized);
        });
        if (hasRejectedRecord) {
          corruptRecordsRaw = saved;
          corruptRecordsStatus = "部分记录无效或重复";
        }
      } catch (error) {
        recordsByDate.clear();
        corruptRecordsRaw = saved;
        corruptRecordsStatus = "全部无法读取";
      }
    }

    function storeCorruptRecordsBackup() {
      if (!corruptRecordsRaw) return true;
      const previousBackup = storageGet(CORRUPT_RECORDS_BACKUP_KEY);
      if (previousBackup === null || previousBackup === corruptRecordsRaw) {
        return storageSet(CORRUPT_RECORDS_BACKUP_KEY, corruptRecordsRaw) === true;
      }

      let archive = [];
      try {
        const parsed = JSON.parse(storageGet(CORRUPT_RECORDS_BACKUP_V2_KEY) || "[]");
        if (Array.isArray(parsed)) archive = parsed;
      } catch (error) {
        archive = [];
      }
      archive.push({ savedAt: new Date().toISOString(), raw: corruptRecordsRaw });
      if (archive.length > 10) archive = archive.slice(-10);
      return storageSet(CORRUPT_RECORDS_BACKUP_V2_KEY, JSON.stringify(archive)) === true;
    }

    function saveRecords() {
      try {
        if (corruptRecordsRaw && !storeCorruptRecordsBackup()) return false;
        const saved = storageSet(STORAGE_KEY, JSON.stringify(getSortedRecords()));
        if (saved !== true) return false;
        corruptRecordsRaw = "";
        corruptRecordsStatus = "";
        return true;
      } catch (error) {
        return false;
      }
    }

    function saveRecordsMessage() {
      return corruptRecordsRaw
        ? "原始异常数据尚未备份：请先处理 dailyDietRecordsV1CorruptBackupV1 后再保存。"
        : "浏览器未能保存记录，请检查存储空间或权限后重试。";
    }

    function loadTargets() {
      try {
        const saved = JSON.parse(storageGet(TARGET_STORAGE_KEY) || "{}");
        dailyTargets = normalizeTargetsObject(saved);
      } catch (error) {
        dailyTargets = { intake: "", protein: "", height: "", water: "" };
      }
      syncTargetInputs();
    }

    function saveTargets() {
      const intake = readNumber(targetIntakeInput.value, false);
      const protein = readNumber(targetProteinInput.value, false);
      const height = readNumber(heightInput.value, false);
      const water = readNumber(targetWaterInput.value, false);

      if (intake === null || protein === null || height === null || water === null) {
        setMessage(targetMessage, "目标需要填写大于或等于 0 的数字，也可以留空。", "error");
        return;
      }

      const previousTargets = { ...dailyTargets };
      dailyTargets = {
        intake: intake === 0 ? "" : intake,
        protein: protein === 0 ? "" : protein,
        height: height === 0 ? "" : height,
        water: water === 0 ? "" : water
      };
      if (!writeTargets(dailyTargets)) {
        dailyTargets = previousTargets;
        syncTargetInputs();
        setMessage(targetMessage, "浏览器未能保存目标，请检查存储空间或权限后重试。", "error");
        render();
        return;
      }
      syncTargetInputs();
      setMessage(targetMessage, "目标已保存，日历颜色已更新。", "success");
      render();
    }

    function importInitialRecords() {
      if (localStorage.getItem(SEED_KEY) === "done") return;

      INITIAL_RECORDS.forEach((record) => {
        if (!recordsByDate.has(record.date)) {
          recordsByDate.set(record.date, {
            date: record.date,
            intake: record.intake,
            weight: "",
            protein: ""
          });
        }
      });

      if (!saveRecords()) {
        setMessage(formMessage, saveRecordsMessage(), "error");
        return;
      }
      localStorage.setItem(SEED_KEY, "done");
    }

    function getSortedRecords() {
      return Array.from(recordsByDate.values()).sort((a, b) => a.date.localeCompare(b.date));
    }

    function recordsInLastCalendarDays(records, days) {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      now.setDate(now.getDate() - (days - 1));
      const cutoff = toDateString(now);
      const todayStr = toDateString(new Date());
      return records.filter((record) => record.date >= cutoff && record.date <= todayStr);
    }

    function isValidDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const date = new Date(`${value}T00:00:00`);
      return !Number.isNaN(date.getTime()) && toDateString(date) === value;
    }

    function normalizeDate(value) {
      const clean = String(value ?? "")
        .trim()
        .replace(/年|[./、]/g, "-")
        .replace(/月/g, "-")
        .replace(/日/g, "")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      const fullDate = clean.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      const shortDate = clean.match(/^(\d{1,2})-(\d{1,2})$/);
      let date = "";

      if (fullDate) {
        date = `${fullDate[1]}-${fullDate[2].padStart(2, "0")}-${fullDate[3].padStart(2, "0")}`;
      } else if (shortDate) {
        date = `${today.slice(0, 4)}-${shortDate[1].padStart(2, "0")}-${shortDate[2].padStart(2, "0")}`;
      }

      return isValidDate(date) ? date : "";
    }

    function recordFromInputs() {
      const date = dateInput.value;
      const intake = readNumber(intakeInput.value, true);
      const weight = readNumber(weightInput.value, false);
      const protein = readNumber(proteinInput.value, false);
      const water = readNumber(waterInput.value, false);

      if (!isValidDate(date)) return { error: "请选择正确的日期。" };
      if (intake === null) return { error: "摄入是必填项，请填写一个大于或等于 0 的数字。" };
      if (weight === null) return { error: "体重如果填写，需要是大于或等于 0 的数字。" };
      if (protein === null) return { error: "蛋白质如果填写，需要是大于或等于 0 的数字。" };
      if (water === null) return { error: "饮水如果填写，需要是大于或等于 0 的数字。" };

      return { date, intake, weight, protein, water };
    }

    function fillForm(record) {
      dateInput.value = record.date;
      intakeInput.value = record.intake;
      weightInput.value = record.weight === "" ? "" : record.weight;
      proteinInput.value = record.protein === "" ? "" : record.protein;
      waterInput.value = record.water === "" || record.water === undefined ? "" : record.water;
    }

    function clearFormForDate(date) {
      dateInput.value = date;
      intakeInput.value = "";
      weightInput.value = "";
      proteinInput.value = "";
      waterInput.value = "";
    }

    function refreshToday() {
      const nextToday = toDateString(new Date());
      if (nextToday === today) return;
      const previousToday = today;
      today = nextToday;
      todayText.textContent = `今天：${formatDateText(today)}`;
      if (selectedDate === previousToday && dateInput.value === previousToday && !intakeInput.value && !weightInput.value && !proteinInput.value && !waterInput.value) {
        selectedDate = today;
        calendarYear = Number(today.slice(0, 4));
        calendarMonth = Number(today.slice(5, 7)) - 1;
        clearFormForDate(today);
      }
      render();
    }

    function scheduleTodayRefresh() {
      const next = new Date();
      next.setHours(24, 0, 1, 0);
      window.setTimeout(() => {
        refreshToday();
        scheduleTodayRefresh();
      }, next - new Date());
    }

    // 标签页休眠跨天后恢复：定时器可能已被节流或丢失，唤醒时立即重算今天。
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshToday();
    });
    window.addEventListener("pageshow", refreshToday);

    function updateFormTitle() {
      formTitle.textContent = selectedDate === today ? "今天记录" : `编辑 ${formatDateText(selectedDate)}`;
    }

    function renderStorageStatus() {
      if (restoreRecoveryPending) {
        storageWarning.hidden = false;
        storageWarning.textContent = "检测到未完成的恢复日志。为保护旧数据，已暂停新的保存操作；请勿清除站点数据，刷新后会自动重试恢复。";
      } else if (storageUnavailable) {
        storageWarning.hidden = false;
        storageWarning.textContent = "当前浏览器无法保存到本地存储：页面只能临时使用，关闭后数据可能丢失。";
      } else {
        storageWarning.hidden = true;
      }
    }

    function render() {
      const sorted = getSortedRecords();
      const habitReview = sorted.length ? recordHabitReview(sorted) : "";
      updateFormTitle();
      renderStorageStatus();
      renderTodaySummary(sorted, habitReview);
      renderStats(sorted, habitReview);
      renderCharts(sorted);
      renderCalendar();
      renderReview();
      renderTargetProgress();
      renderRecords(sorted);
    }

    function valueOrEmpty(value, unit) {
      return value === "" || !Number.isFinite(Number(value)) ? "未填写" : `${roundValue(Number(value))} ${unit}`;
    }

    function targetNoteForToday(record, key, label) {
      if (!record) return "保存后这里会更新";
      let target, unit;
      if (key === "intake") { target = dailyTargets.intake; unit = "kcal"; }
      else if (key === "protein") { target = dailyTargets.protein; unit = "g"; }
      else if (key === "water") { target = dailyTargets.water; unit = "ml"; }
      else return "目标还没有设置";
      if (target === "" || !Number.isFinite(Number(target)) || Number(target) <= 0) return "还没有设置目标";
      const value = record[key] === undefined ? "" : record[key];
      const check = metricTargetStatus(label, value, target, unit);
      return check ? check.text : "目标还没有设置";
    }

    function calculateBMI(weight, height) {
      if (!weight || !height || weight === "" || height === "") return null;
      const w = Number(weight);
      const h = Number(height) / 100;
      if (w <= 0 || h <= 0) return null;
      return w / (h * h);
    }

    function bmiCategory(bmi) {
      if (bmi === null) return "";
      if (bmi < 18.5) return "偏瘦";
      if (bmi < 24) return "正常";
      if (bmi < 28) return "偏胖";
      return "肥胖";
    }

    function renderTodaySummary(sorted, habitReview) {
      const todayRecord = recordsByDate.get(today);
      const latest = sorted[sorted.length - 1];
      const latestText = latest ? `${latest.date} · ${roundValue(Number(latest.intake))} kcal` : "还没有记录";
      const latestNote = latest
        ? `共 ${sorted.length} 天，最近一次数据已保存`
        : "先填今天，趋势会自动出现";

      todaySummary.innerHTML = `
        <div class="summary-card">
          <span class="summary-label">今天摄入</span>
          <strong class="summary-value">${todayRecord ? valueOrEmpty(todayRecord.intake, "kcal") : "未填写"}</strong>
          <span class="summary-note">${targetNoteForToday(todayRecord, "intake", "热量")}</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">今天饮水</span>
          <strong class="summary-value">${todayRecord ? valueOrEmpty(todayRecord.water ?? "", "ml") : "未填写"}</strong>
          <span class="summary-note">${targetNoteForToday(todayRecord, "water", "饮水")}</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">连续记录</span>
          <strong class="summary-value">${sorted.length ? consecutiveRecordDays(sorted) + "天" : "--"}</strong>
          <span class="summary-note">${sorted.length ? habitReview : "开始记录吧"}</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">今天蛋白</span>
          <strong class="summary-value">${todayRecord ? valueOrEmpty(todayRecord.protein, "g") : "未填写"}</strong>
          <span class="summary-note">${targetNoteForToday(todayRecord, "protein", "蛋白")}</span>
        </div>
        <div class="summary-card wide">
          <span class="summary-label">最近记录</span>
          <strong class="summary-value">${latestText}</strong>
          <span class="summary-note">${latestNote}</span>
        </div>
      `;
    }

    function renderStats(sorted, habitReview) {
      if (!sorted.length) {
        stats.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">还没有记录。先保存今天的摄入，趋势会立刻出现。</div>
        `;
        return;
      }

      const latest = sorted[sorted.length - 1];
      const averageProtein = averageFilledValue(sorted, "protein");
      const averageWater = averageFilledValue(sorted, "water");
      const weeklyWeightChange = averageWeeklyWeightChange(sorted);
      const weeklyWeightReview = weightTrendReview(sorted, weeklyWeightChange);
      const bmi = calculateBMI(latest.weight, dailyTargets.height);
      const bmiText = bmi === null ? "未填" : roundValue(bmi);
      const bmiNote = bmi === null ? "设置身高后显示" : bmiCategory(bmi);

      const latestGroup = [
        statCard("最近摄入", latest.intake, "kcal", "", "stat-accent"),
        statCard("最近体重", latest.weight === "" ? "未填" : latest.weight, latest.weight === "" ? "" : "kg"),
        statCard("最近蛋白质", latest.protein === "" ? "未填" : latest.protein, latest.protein === "" ? "" : "g"),
        statCard("最近饮水", (latest.water === "" || latest.water === undefined) ? "未填" : latest.water, (latest.water === "" || latest.water === undefined) ? "" : "ml"),
      ];

      const last7 = recordsInLastCalendarDays(sorted, 7);
      const avgIntake7 = averageFilledValue(last7, "intake");
      const rate = weeklyTargetRate(last7, dailyTargets.intake, "热量", "kcal");
      const proteinRate = weeklyTargetRate(last7, dailyTargets.protein, "蛋白", "g");
      const weekGroup = [
        statCard("近 7 天达标", rate.text, "", rate.note === "近 7 天" ? "" : rate.note),
        statCard("近 7 天蛋白达标", proteinRate.text, "", proteinRate.note === "近 7 天" ? "" : proteinRate.note),
        statCard("平均摄入", avgIntake7 === null ? "--" : roundValue(avgIntake7), avgIntake7 === null ? "" : "kcal/天"),
      ];

      const trendGroup = [
        statCard("平均周体重变化", weeklyWeightChange === null ? "未填" : formatSignedValue(weeklyWeightChange), weeklyWeightChange === null ? "" : "kg/周", weeklyWeightReview, "stat-compact"),
      ];

      if (dailyTargets.height) {
        trendGroup.push(statCard("BMI", bmiText, "", bmiNote, "stat-compact"));
      }

      trendGroup.push(
        statCard("平均蛋白", averageProtein === null ? "未填" : roundValue(averageProtein), averageProtein === null ? "" : "g/天", "", "stat-compact"),
        statCard("平均饮水", averageWater === null ? "未填" : roundValue(averageWater), averageWater === null ? "" : "ml/天", "", "stat-compact"),
        statCard("已记录", sorted.length, "天", habitReview, "stat-compact stat-wide"),
      );

      stats.innerHTML = [
        statsGroupLabel("最近一天"),
        ...latestGroup,
        statsGroupLabel("近 7 天达成"),
        ...weekGroup,
        statsGroupLabel("长期趋势"),
        ...trendGroup,
      ].join("");
    }

    function averageFilledValue(records, key) {
      const values = records
        .map((record) => record[key])
        .filter((value) => value !== "" && Number.isFinite(Number(value)))
        .map(Number);

      if (!values.length) return null;
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function weeklyTargetRate(records, target, targetMetricName, targetUnit) {
      if (!target || !Number(target)) return { text: "--", note: "未设目标" };
      const dataKey = targetMetricName === "热量" ? "intake" : targetMetricName === "蛋白" ? "protein" : "water";
      const withData = records.filter((record) => record[dataKey] !== "");
      if (!withData.length) return { text: "--", note: "暂无数据" };
      const hit = withData.filter(r => {
        const s = metricTargetStatus(targetMetricName, r[dataKey], target, targetUnit);
        return s && s.level === "good";
      }).length;
      return { text: `${hit}/${withData.length}`, note: "近 7 天" };
    }

    function averageWeeklyWeightChange(records) {
      const weightPoints = records
        .filter((record) => record.weight !== "" && Number.isFinite(Number(record.weight)))
        .map((record) => ({ date: record.date, value: Number(record.weight) }));

      if (weightPoints.length < 2) return null;

      const first = weightPoints[0];
      const last = weightPoints[weightPoints.length - 1];
      const days = daysBetween(first.date, last.date);
      if (days <= 0) return null;

      return ((last.value - first.value) / days) * 7;
    }

    function consecutiveRecordDays(records) {
      if (!records.length) return 0;
      const lastGap = daysBetween(records[records.length - 1].date, toDateString(new Date()));
      if (lastGap < 0 || lastGap > 1) return 0;

      let streak = 1;
      for (let index = records.length - 1; index > 0; index -= 1) {
        if (daysBetween(records[index - 1].date, records[index].date) !== 1) break;
        streak += 1;
      }
      return streak;
    }

    function recordHabitReview(records) {
      const streak = consecutiveRecordDays(records);
      if (streak >= 30) return `优秀连续 · ${streak} 天`;
      if (streak >= 14) return `很稳 · 连续 ${streak} 天`;
      if (streak >= 7) return `良好 · 连续 ${streak} 天`;
      if (streak >= 3) return `保持中 · 连续 ${streak} 天`;
      if (records.length >= 14) return "有积累 · 继续连起来";
      return "刚起步 · 先记满 3 天";
    }

    function latestWeightValue(records) {
      const point = records
        .slice()
        .reverse()
        .find((record) => record.weight !== "" && Number.isFinite(Number(record.weight)));

      return point ? Number(point.weight) : null;
    }

    function weightTrendReview(records, weeklyChange) {
      const latestWeight = latestWeightValue(records);
      if (weeklyChange === null || latestWeight === null || latestWeight <= 0) return "";
      if (Math.abs(weeklyChange) <= 0.1) return "稳定 · 波动很小";
      if (weeklyChange > 0) return "回升中 · 看看热量和活动";

      const weeklyLossPercent = Math.abs(weeklyChange) / latestWeight * 100;
      const percentText = `${roundValue(weeklyLossPercent)}%/周`;

      if (weeklyLossPercent < 0.25) return `偏慢 · 约 ${percentText}`;
      if (weeklyLossPercent < 0.5) return `良好 · 约 ${percentText}`;
      if (weeklyLossPercent <= 1) return `优秀 · 约 ${percentText}`;
      if (weeklyLossPercent <= 1.5) return `偏快 · 约 ${percentText}`;
      return `过于激进 · 约 ${percentText}`;
    }

    function daysBetween(startDate, endDate) {
      const start = new Date(`${startDate}T00:00:00`);
      const end = new Date(`${endDate}T00:00:00`);
      return Math.round((end - start) / 86400000);
    }

    function formatSignedValue(value) {
      const rounded = roundValue(value);
      return value > 0 ? `+${rounded}` : rounded;
    }

    function statCard(name, value, unit, note = "", variant = "") {
      const isEmpty = value === "未填" || value === "--" || value === "";
      const classes = ["stat"];
      if (variant) classes.push(variant);
      return `
        <div class="${classes.join(" ")}">
          <div class="stat-name">${name}</div>
          <div class="stat-value${isEmpty ? " is-empty" : ""}">${value}</div>
          <div class="stat-unit">${unit}</div>
          ${note ? `<div class="stat-note">${note}</div>` : ""}
        </div>
      `;
    }

    function statsGroupLabel(text) {
      return `<div class="stats-group-label">${text}</div>`;
    }

    function renderCharts(sorted) {
      if (!sorted.length) {
        charts.innerHTML = "";
        return;
      }

      const ranged = chartRange ? recordsInLastCalendarDays(sorted, chartRange) : sorted;
      if (!ranged.length) {
        charts.innerHTML = makeIntakeOverview([], [], null);
        return;
      }

      const intakeValues = ranged.map((record, index) => ({ index, date: record.date, value: record.intake }));
      const allIntakeValues = sorted.map((record, index) => ({ index, date: record.date, value: record.intake }));
      const targetIntake = dailyTargets.intake && Number(dailyTargets.intake) > 0 ? Number(dailyTargets.intake) : null;
      const extraCharts = [
        compactMetricCard(ranged, "weight", "体重", "kg", "var(--green)", "#34c759"),
        compactMetricCard(ranged, "protein", "蛋白质", "g", "var(--orange)", "#ff9500")
      ].filter(Boolean).join("");

      charts.innerHTML = makeIntakeOverview(ranged, intakeValues, targetIntake, allIntakeValues) + extraCharts;
    }

    function makeIntakeOverview(records, values, targetIntake, allValues = values) {
      const activeRange = chartRange || 0;
      if (!values.length) {
        return `
          <div class="chart-card">
            <div class="chart-head">
              <h3 class="chart-title"><span class="dot" style="background:var(--blue)"></span>摄入总览</h3>
              <div class="chart-range-btns">
                <button class="range-btn${activeRange === 7 ? " active" : ""}" type="button" data-range="7" aria-pressed="${activeRange === 7}">7天</button>
                <button class="range-btn${activeRange === 30 ? " active" : ""}" type="button" data-range="30" aria-pressed="${activeRange === 30}">30天</button>
                <button class="range-btn${activeRange === 0 ? " active" : ""}" type="button" data-range="0" aria-pressed="${activeRange === 0}">全部</button>
              </div>
            </div>
            <div class="empty-state">该范围暂无记录</div>
          </div>
        `;
      }
      const averageValues = movingAverage(values, allValues, 7);
      const latest = values[values.length - 1].value;
      const average = Math.round(values.reduce((sum, point) => sum + point.value, 0) / values.length);
      const highest = values.reduce((max, point) => point.value > max.value ? point : max, values[0]);
      const lowest = values.reduce((min, point) => point.value < min.value ? point : min, values[0]);
      const rangeLabel = activeRange ? `近 ${activeRange} 天 · ${records.length} 个点` : `${records.length} 天全部显示`;

      const chartContent = chartView === "bar"
        ? makeWeeklyBarChart(records, targetIntake)
        : makeCompactChart(records, values, averageValues, "#8ec5ff", "#0057d9", "kcal", targetIntake);

      const legendContent = chartView === "bar"
        ? (targetIntake ? `<span class="legend-item"><span class="legend-line" style="height:2px;background:var(--red);border-style:dashed"></span>目标 ${targetIntake} kcal</span>` : "")
        : `<span class="legend-item"><span class="legend-line" style="background:#8ec5ff"></span>每天</span>
            <span class="legend-item"><span class="legend-line" style="height:5px;background:#0057d9"></span>7天平均</span>
            ${targetIntake ? `<span class="legend-item"><span class="legend-line" style="height:2px;background:var(--red);border-style:dashed"></span>目标 ${targetIntake} kcal</span>` : ""}`;

      return `
        <div class="chart-card">
          <div class="chart-head">
            <h3 class="chart-title"><span class="dot" style="background:var(--blue)"></span>摄入总览</h3>
            <div class="chart-range-btns">
              <button class="range-btn${chartView === "line" ? " active" : ""}" type="button" data-view="line" aria-pressed="${chartView === "line"}">折线</button>
              <button class="range-btn${chartView === "bar" ? " active" : ""}" type="button" data-view="bar" aria-pressed="${chartView === "bar"}">周均</button>
            </div>
            <div class="chart-range-btns">
              <button class="range-btn${activeRange === 7 ? " active" : ""}" type="button" data-range="7" aria-pressed="${activeRange === 7}">7天</button>
              <button class="range-btn${activeRange === 30 ? " active" : ""}" type="button" data-range="30" aria-pressed="${activeRange === 30}">30天</button>
              <button class="range-btn${activeRange === 0 ? " active" : ""}" type="button" data-range="0" aria-pressed="${activeRange === 0}">全部</button>
            </div>
            <span class="chart-note">${rangeLabel}</span>
          </div>
          <div class="trend-summary">
            <div class="trend-chip"><span>最近一天</span><strong>${latest} kcal</strong></div>
            <div class="trend-chip"><span>平均摄入</span><strong>${average} kcal</strong></div>
            <div class="trend-chip"><span>范围</span><strong>${lowest.value}-${highest.value}</strong></div>
          </div>
          <div class="legend">${legendContent}</div>
          <div class="chart-frame">${chartContent}</div>
        </div>
      `;
    }

    function compactMetricCard(records, key, label, unit, colorVar, color) {
      const values = records
        .map((record, index) => ({ index, date: record.date, value: record[key] }))
        .filter((point) => point.value !== "" && Number.isFinite(Number(point.value)));

      if (!values.length) return "";

      const activeRange = chartRange || 0;

      return `
        <div class="chart-card">
          <div class="chart-head">
            <h3 class="chart-title"><span class="dot" style="background:${colorVar}"></span>${label}</h3>
            <div class="chart-range-btns">
              <button class="range-btn${activeRange === 7 ? " active" : ""}" type="button" data-range="7" aria-pressed="${activeRange === 7}">7天</button>
              <button class="range-btn${activeRange === 30 ? " active" : ""}" type="button" data-range="30" aria-pressed="${activeRange === 30}">30天</button>
              <button class="range-btn${activeRange === 0 ? " active" : ""}" type="button" data-range="0" aria-pressed="${activeRange === 0}">全部</button>
            </div>
            <span class="chart-note">${values.length} 个点</span>
          </div>
          <div class="chart-frame">${makeCompactChart(records, values, [], color, color, unit)}</div>
        </div>
      `;
    }

    function makeWeeklyBarChart(records, targetIntake) {
      const width = 760;
      const height = 250;
      const pad = { top: 22, right: 24, bottom: 46, left: 54 };

      const weeks = groupRecordsByCalendarWeek(records);

      if (!weeks.length) return "";

      const maxVal = Math.max(...weeks.map(w => w.avg), targetIntake || 0);
      const minVal = Math.min(...weeks.map(w => w.avg));
      const gap = Math.max((maxVal - minVal) * 0.12, 50);
      const yMin = Math.max(0, minVal - gap);
      const yMax = maxVal + gap;
      const range = yMax - yMin || 1;
      const bottom = height - pad.bottom;
      const plotWidth = width - pad.left - pad.right;
      const barWidth = Math.max(16, Math.min(60, (plotWidth / weeks.length) * 0.7));
      const gapX = (plotWidth - barWidth * weeks.length) / (weeks.length + 1);

      const y = (value) => bottom - ((Number(value) - yMin) / range) * (height - pad.top - pad.bottom);

      const bars = weeks.map((w, i) => {
        const bx = pad.left + gapX + i * (barWidth + gapX);
        const by = y(w.avg);
        const bh = bottom - by;
        return `<rect x="${bx}" y="${by}" width="${barWidth}" height="${bh}" rx="4" fill="#8ec5ff" opacity="0.85">
          <title>${w.label}: ${w.avg} kcal (${w.count}天)</title>
        </rect>
        <text x="${bx + barWidth / 2}" y="${by - 6}" text-anchor="middle" fill="var(--muted)" font-size="10">${w.avg}</text>`;
      }).join("");

      const targetLine = targetIntake && targetIntake >= yMin && targetIntake <= yMax
        ? `<line x1="${pad.left}" y1="${y(targetIntake)}" x2="${width - pad.right}" y2="${y(targetIntake)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"></line>`
        : "";

      const xLabels = weeks.map((w, i) => {
        const bx = pad.left + gapX + i * (barWidth + gapX) + barWidth / 2;
        const label = weeks.length > 10 ? w.label.slice(5) : w.label;
        return `<text x="${bx}" y="${height - 12}" text-anchor="middle" fill="var(--muted)" font-size="10" transform="rotate(-25, ${bx}, ${height - 12})">${label}</text>`;
      }).join("");

      return `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="周均柱状图">
          <rect x="0" y="0" width="${width}" height="${height}" rx="18" fill="var(--chart-bg)"></rect>
          <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${bottom}" stroke="var(--line)"></line>
          <line x1="${pad.left}" y1="${bottom}" x2="${width - pad.right}" y2="${bottom}" stroke="var(--line)"></line>
          <text x="${pad.left - 10}" y="${pad.top + 5}" text-anchor="end" fill="var(--muted)" font-size="12">${yMax}</text>
          <text x="${pad.left - 10}" y="${bottom + 4}" text-anchor="end" fill="var(--muted)" font-size="12">${yMin}</text>
          ${targetLine}
          ${bars}
          ${xLabels}
        </svg>
      `;
    }

    function movingAverage(values, allValues, days) {
      return values.map((point) => {
        const end = new Date(`${point.date}T00:00:00`);
        const start = new Date(end);
        start.setDate(start.getDate() - (days - 1));
        const startString = toDateString(start);
        const group = allValues.filter((item) => item.date >= startString && item.date <= point.date);
        const average = group.reduce((sum, item) => sum + Number(item.value), 0) / group.length;
        return { index: point.index, date: point.date, value: Math.round(average) };
      });
    }

    function groupRecordsByCalendarWeek(records) {
      const weeks = new Map();
      records.forEach((record) => {
        const weekStart = new Date(`${record.date}T00:00:00`);
        weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
        const key = toDateString(weekStart);
        const week = weeks.get(key) || { start: key, records: [] };
        week.records.push(record);
        weeks.set(key, week);
      });
      return Array.from(weeks.values()).map((week) => {
        const end = new Date(`${week.start}T00:00:00`);
        end.setDate(end.getDate() + 6);
        return {
          label: `${week.start} 至 ${toDateString(end)}`,
          avg: Math.round(week.records.reduce((sum, record) => sum + Number(record.intake), 0) / week.records.length),
          count: week.records.length
        };
      });
    }

    function chartMinimumGap(unit) {
      if (unit === "kg") return 0.5;
      if (unit === "g") return 5;
      return 50;
    }

    function makeCompactChart(records, values, averageValues, color, averageColor, unit, targetValue) {
      const width = 760;
      const height = 250;
      const pad = { top: 22, right: 24, bottom: 46, left: 54 };
      const allValues = values.concat(averageValues);
      const minRaw = Math.min(...allValues.map((point) => Number(point.value)));
      const maxRaw = Math.max(...allValues.map((point) => Number(point.value)));
      const gap = Math.max((maxRaw - minRaw) * 0.12, chartMinimumGap(unit));
      const min = Math.max(0, minRaw - gap);
      const max = maxRaw + gap;
      const range = max - min || 1;
      const bottom = height - pad.bottom;
      const plotWidth = width - pad.left - pad.right;

      const x = (index) => {
        if (records.length === 1) return pad.left + plotWidth / 2;
        return pad.left + (index / (records.length - 1)) * plotWidth;
      };
      const y = (value) => bottom - ((Number(value) - min) / range) * (height - pad.top - pad.bottom);
      const dailyPath = makePath(values, x, y);
      const averagePath = makePath(averageValues, x, y);
      const fillId = `chartFill${color.replace(/[^a-z0-9]/gi, "")}${unit}`;
      const area = values.length > 1
        ? `${dailyPath} L ${x(values[values.length - 1].index)} ${bottom} L ${x(values[0].index)} ${bottom} Z`
        : "";

      const labels = makeDateLabels(records, x, height);
      const points = values.length <= 14
        ? values.map((point) => `<circle cx="${x(point.index)}" cy="${y(point.value)}" r="4" fill="#fff" stroke="${color}" stroke-width="2.5"></circle>`).join("")
        : "";
      const hoverPoints = makeHoverPoints(values, x, y, bottom, pad, width, unit, color);

      return `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="趋势图">
          <defs>
            <linearGradient id="${fillId}" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="${color}" stop-opacity="0.28"></stop>
              <stop offset="100%" stop-color="${color}" stop-opacity="0.02"></stop>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="${width}" height="${height}" rx="18" fill="var(--chart-bg)"></rect>
          <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${bottom}" stroke="var(--line)"></line>
          <line x1="${pad.left}" y1="${bottom}" x2="${width - pad.right}" y2="${bottom}" stroke="var(--line)"></line>
          <line x1="${pad.left}" y1="${y((max + min) / 2)}" x2="${width - pad.right}" y2="${y((max + min) / 2)}" stroke="var(--line)" stroke-dasharray="6 8"></line>
          ${targetValue !== null && targetValue >= min && targetValue <= max ? `<line x1="${pad.left}" y1="${y(targetValue)}" x2="${width - pad.right}" y2="${y(targetValue)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"></line>` : ""}
          <text x="${pad.left - 10}" y="${pad.top + 5}" text-anchor="end" fill="var(--muted)" font-size="12">${roundValue(maxRaw)}</text>
          <text x="${pad.left - 10}" y="${bottom + 4}" text-anchor="end" fill="var(--muted)" font-size="12">${roundValue(minRaw)}</text>
          ${area ? `<path d="${area}" fill="url(#${fillId})"></path>` : ""}
          <path d="${dailyPath}" fill="none" stroke="${color}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path>
          ${averagePath ? `<path d="${averagePath}" fill="none" stroke="${averageColor}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>` : ""}
          ${points}
          ${labels}
          ${hoverPoints}
          <title>${records[0].date} 到 ${records[records.length - 1].date}，单位 ${unit}</title>
        </svg>
      `;
    }

    function makeHoverPoints(values, x, y, bottom, pad, width, unit, color) {
      const tooltipWidth = 108;
      const tooltipHeight = 42;

      return values.map((point, index) => {
        const pointX = x(point.index);
        const pointY = y(point.value);
        const previousX = index === 0 ? pad.left : (x(values[index - 1].index) + pointX) / 2;
        const nextX = index === values.length - 1 ? width - pad.right : (pointX + x(values[index + 1].index)) / 2;
        const hitX = Math.max(pad.left, previousX);
        const hitWidth = Math.max(8, Math.min(width - pad.right, nextX) - hitX);
        const tooltipX = Math.min(Math.max(pointX - tooltipWidth / 2, pad.left + 4), width - pad.right - tooltipWidth - 4);
        const aboveY = pointY - tooltipHeight - 14;
        const tooltipY = aboveY < pad.top ? pointY + 14 : aboveY;
        const valueText = `${roundValue(Number(point.value))} ${unit}`;

        return `
          <g class="hover-point" tabindex="0" aria-label="${point.date} ${valueText}">
            <rect class="chart-hover-region" x="${hitX}" y="${pad.top}" width="${hitWidth}" height="${bottom - pad.top}"></rect>
            <line class="chart-focus-line" x1="${pointX}" y1="${pad.top}" x2="${pointX}" y2="${bottom}" stroke="${color}" stroke-dasharray="3 5"></line>
            <circle class="chart-focus-dot" cx="${pointX}" cy="${pointY}" r="5.5" fill="#fff" stroke="${color}" stroke-width="2.5"></circle>
            <g class="point-tooltip" transform="translate(${tooltipX} ${tooltipY})">
              <rect width="${tooltipWidth}" height="${tooltipHeight}" rx="8"></rect>
              <text class="tooltip-date" x="10" y="16">${point.date}</text>
              <text class="tooltip-value" x="10" y="32">${valueText}</text>
            </g>
          </g>
        `;
      }).join("");
    }

    function makePath(values, x, y) {
      if (!values.length) return "";
      return values.map((point, index) => {
        const prefix = index === 0 ? "M" : "L";
        return `${prefix} ${x(point.index)} ${y(point.value)}`;
      }).join(" ");
    }

    function makeDateLabels(records, x, height) {
      const positions = records.length <= 3
        ? records.map((record, index) => index)
        : [0, Math.floor((records.length - 1) / 2), records.length - 1];

      return positions.map((index) => `
        <text x="${x(index)}" y="${height - 18}" text-anchor="middle" fill="var(--muted)" font-size="12">${records[index].date.slice(5)}</text>
      `).join("");
    }

    function roundValue(value) {
      return Number(value).toFixed(Number.isInteger(value) ? 0 : 1);
    }

    function renderCalendar() {
      const firstDay = new Date(calendarYear, calendarMonth, 1);
      const lastDay = new Date(calendarYear, calendarMonth + 1, 0);
      const startWeekday = firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      monthTitle.textContent = `${calendarYear}年${calendarMonth + 1}月`;

      const cells = weekdays.map((day) => `<div class="weekday">${day}</div>`);
      for (let i = 0; i < startWeekday; i += 1) {
        cells.push(`<button class="day empty" type="button" disabled></button>`);
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = `${calendarYear}-${String(calendarMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const record = recordsByDate.get(date);
        const status = targetStatusForRecord(record);
        const targetDots = targetDotsForRecord(record);
        const classes = [
          "day",
          record ? "has-record" : "",
          date === selectedDate ? "selected" : "",
          date === toDateString(new Date()) ? "today" : ""
        ].filter(Boolean).join(" ");
        const actionText = record ? "编辑当天记录" : "新增当天记录";
        const statusText = status ? `，目标${status.label}：${status.details.join("，")}` : "";
        cells.push(`<button class="${classes}" type="button" data-date="${date}" title="点击${actionText}${statusText}" aria-label="${formatDateText(date)}，点击${actionText}${statusText}">${day}${targetDots}</button>`);
      }
      calendar.innerHTML = cells.join("");
      calendar.classList.remove("calendar-slide");
      void calendar.offsetWidth;
      calendar.classList.add("calendar-slide");
    }

    function shiftMonth(delta) {
      calendarMonth += delta;
      if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear -= 1;
      }
      if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear += 1;
      }
    }

    function targetStatusForRecord(record) {
      if (!record) return null;

      const checks = targetChecksForRecord(record);

      if (!checks.length) return null;

      const levelRank = { good: 0, warn: 1, low: 2, none: 3 };
      const worst = checks.reduce((current, item) => (
        levelRank[item.level] > levelRank[current.level] ? item : current
      ), checks[0]);

      return {
        level: worst.level,
        label: worst.label,
        details: checks.map((item) => item.text)
      };
    }

    function targetChecksForRecord(record) {
      if (!record) return [];
      const checks = [
        metricTargetStatus("热量", record.intake, dailyTargets.intake, "kcal"),
        metricTargetStatus("蛋白", record.protein, dailyTargets.protein, "g"),
        metricTargetStatus("饮水", record.water === undefined ? "" : record.water, dailyTargets.water, "ml")
      ].filter(Boolean);
      if (record.weight !== "" && record.weight !== undefined && Number(record.weight) > 0) {
        checks.push({ key: "weight", level: "good", label: "已记录", text: `体重 ${record.weight} kg`, ratio: null });
      }
      return checks;
    }

    function targetDotsForRecord(record) {
      const checks = targetChecksForRecord(record);
      if (!checks.length) return "";

      const dots = checks.map((check) => (
        `<span class="target-marker metric-${check.key} target-status-${check.level}" title="${check.text}"></span>`
      )).join("");
      return `<span class="day-target-dots" aria-hidden="true">${dots}</span>`;
    }

    function metricTargetStatus(name, value, target, unit) {
      if (target === "" || !Number.isFinite(Number(target)) || Number(target) <= 0) return null;

      const keyMap = { "热量": "intake", "蛋白": "protein", "饮水": "water" };
      const key = keyMap[name] || "intake";
      const policy = METRIC_POLICIES[name] || { type: "minimum" };
      const labels = { good: "达标", warn: "稍低", low: "偏低", none: "未填" };
      if (value === "" || !Number.isFinite(Number(value))) {
        return {
          level: "none",
          label: labels.none,
          ratio: null,
          actual: null,
          target: Number(target),
          unit,
          name,
          key,
          policy: policy.type,
          text: `${name}未填，目标 ${roundValue(Number(target))}${unit}`
        };
      }

      const actual = Number(value);
      const ratio = actual / Number(target);
      const level = ratio >= 1 ? "good" : ratio >= 0.7 ? "warn" : "low";
      return {
        level,
        label: labels[level],
        ratio,
        actual,
        target: Number(target),
        unit,
        name,
        key,
        policy: policy.type,
        text: `${name}${labels[level]} ${roundValue(actual)}/${roundValue(Number(target))}${unit}`
      };
    }

    function isImportHeaderLine(line) {
      return /日期/.test(line) && /摄入|热量|卡路里|大卡|千卡|kcal/i.test(line);
    }

    function findDateInImportLine(line) {
      const fullDate = line.match(/(\d{4})\s*(?:年|[./\-、])\s*(\d{1,2})\s*(?:月|[./\-、])\s*(\d{1,2})\s*日?/);
      if (fullDate) {
        return {
          date: normalizeDate(`${fullDate[1]}-${fullDate[2]}-${fullDate[3]}`),
          index: fullDate.index,
          raw: fullDate[0]
        };
      }

      const shortDate = line.match(/(\d{1,2})\s*(?:月\s*(\d{1,2})\s*日?|[./\-、]\s*(\d{1,2}))/);
      if (shortDate) {
        return {
          date: normalizeDate(`${shortDate[1]}-${shortDate[2] || shortDate[3]}`),
          index: shortDate.index,
          raw: shortDate[0]
        };
      }

      return { date: "", index: -1, raw: "" };
    }

    function readImportNumbers(text) {
      return String(text ?? "")
        .replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g, " ")
        .replace(/\d+(?:\.\d+)?%/g, " ")
        .replace(/[：:=]/g, " ")
        .replace(/[，,;；|\t]/g, " ")
        .replace(/(千卡|大卡|卡路里|kcal|cal|公斤|千克|kg|克|g)/gi, " ")
        .match(/\d+(?:\.\d+)?/g) || [];
    }

    function parseImportLine(line) {
      const dateInfo = findDateInImportLine(line);
      if (!dateInfo.date) return { date: "", intake: null, weight: "", protein: "", water: "" };

      const afterDate = line.slice(dateInfo.index + dateInfo.raw.length);
      const beforeDate = line.slice(0, dateInfo.index);
      const numbers = readImportNumbers(afterDate);
      const fallbackNumbers = numbers.length ? numbers : readImportNumbers(beforeDate);
      const labeledIntake = afterDate.match(/(\d+(?:\.\d+)?)\s*(?:大卡|千卡|卡路里|kcal|cal)/i);
      if (labeledIntake) {
        const afterIntake = afterDate.slice(labeledIntake.index + labeledIntake[0].length);
        const labeledNumbers = readImportNumbers(afterIntake);
        return {
          date: dateInfo.date,
          intake: readNumber(labeledIntake[1], true),
          weight: readNumber(labeledNumbers[0] ?? "", false),
          protein: readNumber(labeledNumbers[1] ?? "", false),
          water: readNumber(labeledNumbers[2] ?? "", false)
        };
      }

      const intake = readNumber(fallbackNumbers[0] ?? "", true);
      const weight = readNumber(fallbackNumbers[1] ?? "", false);
      const protein = readNumber(fallbackNumbers[2] ?? "", false);
      const water = readNumber(fallbackNumbers[3] ?? "", false);

      return { date: dateInfo.date, intake, weight, protein, water };
    }

    function findDuplicateDates(records) {
      const seen = new Set();
      const duplicates = new Set();
      records.forEach((record) => { if (seen.has(record.date)) duplicates.add(record.date); seen.add(record.date); });
      return Array.from(duplicates);
    }

    function parseImportRows(text) {
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      const records = [];
      const errors = [];

      lines.forEach((line, index) => {
        if (isImportHeaderLine(line)) return;

        const result = parseImportLine(line);
        const { date, intake, weight, protein, water } = result;
        const rowNumber = index + 1;

        if (!date) errors.push(`第 ${rowNumber} 行：日期不正确`);
        if (intake === null) errors.push(`第 ${rowNumber} 行：摄入必须填写数字`);
        if (weight === null) errors.push(`第 ${rowNumber} 行：体重需要是数字或留空`);
        if (protein === null) errors.push(`第 ${rowNumber} 行：蛋白质需要是数字或留空`);
        if (water === null) errors.push(`第 ${rowNumber} 行：饮水需要是数字或留空`);

        if (date && intake !== null && weight !== null && protein !== null && water !== null) {
          records.push({ date, intake, weight, protein, water });
        }
      });

      const duplicates = findDuplicateDates(records);
      if (duplicates.length) errors.push(`导入中日期重复：${duplicates.join("、")}`);

      return { records, errors };
    }

    document.querySelector("#fileImportInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const content = ev.target.result;
        let records = [];
        let invalidCount = 0;
        let fullBackup = null;
        if (file.name.endsWith(".json")) {
          try {
            const data = JSON.parse(content);
            if (Array.isArray(data)) {
              data.forEach((entry) => {
                const record = normalizeRecord(entry);
                if (record) records.push(record);
                else invalidCount += 1;
              });
            } else if (data && Array.isArray(data.records)) {
              fullBackup = data;
              data.records.forEach((entry) => {
                const record = normalizeRecord(entry);
                if (record) records.push(record);
                else invalidCount += 1;
              });
            }
          } catch {
            showToast("JSON 格式错误。", "error");
            e.target.value = "";
            return;
          }
        } else {
          const lines = content.split("\n").map(l => l.trim()).filter(l => l);
          const startLine = lines[0].includes("日期") ? 1 : 0;
          const text = lines.slice(startLine).join("\n");
          const result = parseImportRows(text);
          if (result.errors.length) {
            showToast(result.errors.slice(0, 2).join("；"), "error");
            e.target.value = "";
            return;
          }
          records = result.records;
        }
        if (!records.length) {
          showToast("文件中没有找到有效记录。", "error");
          e.target.value = "";
          return;
        }
        if (fullBackup && invalidCount > 0) {
          showToast(`完整备份中包含 ${invalidCount} 条无效记录，已取消导入。`, "error");
          e.target.value = "";
          return;
        }
        const duplicates = findDuplicateDates(records);
        if (duplicates.length) { showToast(`导入中日期重复：${duplicates.join("、")}`, "error"); e.target.value = ""; return; }
        if (fullBackup && fullBackup.schemaVersion !== undefined && fullBackup.schemaVersion !== 1) {
          showToast("不支持的备份版本，已取消导入。", "error");
          e.target.value = "";
          return;
        }
        if (fullBackup) {
          if (!restoreFullBackup({ ...fullBackup, records })) {
            showToast(saveRecordsMessage(), "error");
            e.target.value = "";
            return;
          }
          selectedDate = records[records.length - 1].date;
          calendarYear = Number(selectedDate.slice(0, 4));
          calendarMonth = Number(selectedDate.slice(5, 7)) - 1;
          render();
          showToast(`已恢复完整备份：${records.length} 条记录、目标和主题。`, "success");
          e.target.value = "";
          return;
        }
        if (!applyRecordMutationAndSave(() => {
          records.forEach(r => recordsByDate.set(r.date, r));
          selectedDate = records[records.length - 1].date;
          calendarYear = Number(selectedDate.slice(0, 4));
          calendarMonth = Number(selectedDate.slice(5, 7)) - 1;
        })) {
          showToast(saveRecordsMessage(), "error");
          e.target.value = "";
          return;
        }
        render();
        showToast(`已从文件导入 ${records.length} 条记录。${invalidCount ? `已跳过 ${invalidCount} 条无效数据。` : ""}`, "success");
        e.target.value = "";
      };
      reader.readAsText(file);
    });

      const viewBtn = event.target.closest("[data-view]");
      if (viewBtn) {
        chartView = viewBtn.dataset.view;
        render();
      }
    });
    saveTargetsBtn.addEventListener("click", saveTargets);
    [intakeInput, proteinInput, waterInput].forEach((input) => {
      input.addEventListener("input", renderTargetProgress);
    });

    function jumpToToday() {
      calendarYear = Number(today.slice(0, 4));
      calendarMonth = Number(today.slice(5, 7)) - 1;
      selectedDate = today;
      render();
    }

    function stepWater(delta) {
      const current = readNumber(waterInput.value, false);
      const base = current === "" || current === null ? 0 : Number(current);
      const next = Math.max(0, base + delta);
      waterInput.value = String(next);
      renderTargetProgress();
    }

    document.querySelector("#todayBtn").addEventListener("click", jumpToToday);

    document.querySelector("#copyLatestBtn").addEventListener("click", () => {
      const sorted = getSortedRecords();
      const latest = sorted[sorted.length - 1];
      if (!latest) {
        setMessage(formMessage, "还没有任何记录可以复制。", "error");
        return;
      }
      fillForm({ ...latest, date: dateInput.value || today });
      setMessage(formMessage, `已带入 ${formatDateText(latest.date)} 的数值，确认后点“保存记录”。`, "success");
      intakeInput.focus();
    });

    document.querySelectorAll("[data-water-step]").forEach((button) => {
      button.addEventListener("click", () => stepWater(Number(button.dataset.waterStep)));
    });

    document.querySelector("#exportJsonBtn").addEventListener("click", () => {
      const sorted = getSortedRecords();
      if (!sorted.length) {
        showToast("没有数据可以备份。", "error");
        return;
      }
      const blob = new Blob([JSON.stringify(sorted)], { type: "application/json;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `每日饮食备份_${today}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast(`已导出 ${sorted.length} 条 JSON 备份，可通过“导入文件”恢复。`, "success");
    });

    document.querySelector("#exportFullJsonBtn").addEventListener("click", () => {
      const sorted = getSortedRecords();
      if (!sorted.length) {
        showToast("没有数据可以备份。", "error");
        return;
      }
      const backup = {
        schemaVersion: 1,
        app: "NutriFlow",
        exportedAt: new Date().toISOString(),
        records: sorted,
        targets: { ...dailyTargets },
        preferences: { theme: document.documentElement.getAttribute("data-theme") || "light" }
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `每日饮食完整备份_${today}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast(`已导出完整备份：${sorted.length} 条记录、目标和主题。`, "success");
    });

    // Dark mode toggle
    const themeToggle = document.querySelector("#themeToggle");
    const THEME_KEY = "dailyDietThemeV1";

    function applyTheme(theme) {
      const isDark = theme === "dark";
      if (isDark) {
        document.documentElement.setAttribute("data-theme", "dark");
        themeToggle.textContent = "☀️";
      } else {
        document.documentElement.removeAttribute("data-theme");
        themeToggle.textContent = "🌙";
      }
      themeToggle.setAttribute("aria-label", isDark ? "切换到浅色模式" : "切换到深色模式");
      themeToggle.title = isDark ? "切换到浅色模式" : "切换到深色模式";
    }

    function initTheme() {
      const saved = storageGet(THEME_KEY);
      if (saved) {
        applyTheme(saved);
      } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        applyTheme("dark");
      } else {
        applyTheme("light");
      }
    }

    themeToggle.addEventListener("click", () => {
      if (!ensureRestoreRecovery()) return;
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      applyTheme(next);
      const saved = storageSet(THEME_KEY, next);
      if (saved !== true) {
        showToast("主题已切换，但当前浏览器无法保存偏好。", "error");
      }
    });

    initTheme();

    loadTargets();
    loadRecords();
    recoverRestoreJournal();
    if (corruptRecordsRaw) {
      setMessage(formMessage, `检测到${corruptRecordsStatus}；首次保存会原样备份到 dailyDietRecordsV1CorruptBackupV1。`, "error");
    }
    importInitialRecords();
    if (recordsByDate.has(today)) {
      fillForm(recordsByDate.get(today));
    } else {
      dateInput.value = today;
    }
    todayText.textContent = `今天：${formatDateText(today)}`;
    render();
    scheduleTodayRefresh();

    // 桌面鼠标滚轮 Lenis 式平滑：滚轮只推进虚拟目标位，渲染位置逐帧逼近，
    // 连续滚动累加同一目标，反向时目标立即随新输入移动。
    // 仅 fine pointer；reduced-motion / Ctrl/Cmd 缩放 / Shift 横向 / 触摸 /
    // textarea 与记录列表等内部可滚动区域均保持原生。
    const finePointerQuery = window.matchMedia("(pointer: fine)");
    const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    const SMOOTH_WHEEL_LERP = 0.11;
    const SMOOTH_WHEEL_EPSILON = 0.5;
    const smoothWheel = { current: 0, target: 0, lastFrame: 0, raf: 0, animating: false, ticked: false, watchdog: 0 };

    function wheelDeltaPixels(event) {
      if (event.deltaMode === 1) return event.deltaY * 16;
      if (event.deltaMode === 2) return event.deltaY * window.innerHeight;
      return event.deltaY;
    }

    function cancelSmoothWheelFrame() {
      if (smoothWheel.raf) {
        cancelAnimationFrame(smoothWheel.raf);
        smoothWheel.raf = 0;
      }
      if (smoothWheel.watchdog) {
        clearTimeout(smoothWheel.watchdog);
        smoothWheel.watchdog = 0;
      }
    }

    function syncSmoothWheelToNative() {
      smoothWheel.current = window.scrollY;
      smoothWheel.target = window.scrollY;
      smoothWheel.animating = false;
      cancelSmoothWheelFrame();
    }

    function finishSmoothWheel() {
      smoothWheel.current = smoothWheel.target;
      window.scrollTo(0, smoothWheel.current);
      smoothWheel.animating = false;
      cancelSmoothWheelFrame();
    }

    function smoothWheelStep(timestamp) {
      smoothWheel.ticked = true;
      const dt = smoothWheel.lastFrame ? Math.min(timestamp - smoothWheel.lastFrame, 64) : 16.7;
      smoothWheel.lastFrame = timestamp;
      // 帧率归一化：任意刷新率下收敛速度与 60fps 一致（同 Lenis 的做法）。
      const lerp = 1 - Math.pow(1 - SMOOTH_WHEEL_LERP, dt / 16.7);
      smoothWheel.current += (smoothWheel.target - smoothWheel.current) * lerp;
      if (Math.abs(smoothWheel.target - smoothWheel.current) < SMOOTH_WHEEL_EPSILON) {
        finishSmoothWheel();
        return;
      }
      window.scrollTo(0, smoothWheel.current);
      smoothWheel.raf = requestAnimationFrame(smoothWheelStep);
    }

    function findInnerScrollable(startNode, deltaY) {
      let node = startNode;
      while (node && node !== document.documentElement) {
        if (node.nodeType === Node.ELEMENT_NODE) {
          const overflowY = getComputedStyle(node).overflowY;
          if ((overflowY === "auto" || overflowY === "scroll") && node.scrollHeight > node.clientHeight + 1) {
            const atTop = node.scrollTop <= 0;
            const atBottom = node.scrollTop + node.clientHeight >= node.scrollHeight - 1;
            if ((deltaY > 0 && !atBottom) || (deltaY < 0 && !atTop)) {
              return node;
            }
          }
        }
        node = node.parentNode;
      }
      return null;
    }

    window.addEventListener("wheel", (event) => {
      if (!finePointerQuery.matches || reducedMotionQuery.matches) return;
      if (event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
      if (findInnerScrollable(event.target, event.deltaY)) {
        syncSmoothWheelToNative();
        return;
      }
      event.preventDefault();
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const base = smoothWheel.animating ? smoothWheel.target : window.scrollY;
      smoothWheel.target = Math.max(0, Math.min(maxScroll, base + wheelDeltaPixels(event)));
      if (!smoothWheel.animating) {
        smoothWheel.current = window.scrollY;
        smoothWheel.lastFrame = 0;
        smoothWheel.animating = true;
      }
      if (!smoothWheel.raf) {
        smoothWheel.ticked = false;
        smoothWheel.raf = requestAnimationFrame(smoothWheelStep);
        // 兜底：仅当 rAF 完全停摆（页面挂起）时触发，正常 Chrome 中不可达。
        if (!smoothWheel.watchdog) {
          smoothWheel.watchdog = setTimeout(() => {
            smoothWheel.watchdog = 0;
            if (!smoothWheel.ticked) finishSmoothWheel();
          }, 250);
        }
      }
    }, { passive: false });

    // 原生滚动（滚动条、键盘、导航恢复）重新锚定；动画期间忽略自己 scrollTo 触发的 scroll 事件。
    window.addEventListener("scroll", () => {
      if (!smoothWheel.animating) syncSmoothWheelToNative();
    }, { passive: true });

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(event.key)) {
        syncSmoothWheelToNative();
      }
    }, { passive: true });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
